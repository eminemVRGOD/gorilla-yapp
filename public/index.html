<script>
window.YAPPS_READY = new Promise(function(res){ window.__yappsReady = res; });
if(location.protocol==="file:"){ window.YAPPS={mode:"demo"}; window.__yappsReady(); }
setTimeout(function(){ if(!window.YAPPS){ window.YAPPS={mode:"demo",error:"The server didn't answer in time"}; window.__yappsReady(); } }, 12000);
</script>
<script>
// Gorilla Yapps ↔ Vercel connector.
// Gives the app the same small API as before (window.YAPPS + window.claude.use), backed by this site's own
// server code in /api. It checks for changes every few seconds (faster while you're active).
(function () {
  const TOKEN_KEY = "gy_token";
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  };
  let token = ls.get(TOKEN_KEY);
  let me = null; // {uid, email, owner}

  async function call(path, body) {
    let r;
    try {
      r = await fetch("/api/" + path, {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, token ? { Authorization: "Bearer " + token } : {}),
        body: JSON.stringify(body || {})
      });
    } catch (e) { throw { code: "unavailable", message: "Can't reach the server. Check your internet." }; }
    let j = {};
    try { j = await r.json(); } catch (e) {}
    if (!r.ok) {
      const err = { code: j.error || "error", status: r.status, message: j.message || "Something went wrong. Try again." };
      if (r.status === 401 && me && path !== "auth") { ls.set(TOKEN_KEY, null); setTimeout(() => location.reload(), 300); }
      throw err;
    }
    return j;
  }

  /* ---------------- local copy of the database ---------------- */
  const docs = new Map();          // path -> data (null = known missing)
  const cols = new Map();          // colPath -> {ids:Set, loaded:false, limit:n, loading:Promise}
  const pending = new Set();       // paths with unsaved changes
  const docSubs = new Map();       // path -> Set(fn)
  const colSubs = new Set();       // {path, q, fn}
  const parentOf = p => p.split("/").slice(0, -1).join("/");
  const idOf = p => p.split("/").pop();
  const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
  const merge = (a, b) => {
    const o = Array.isArray(a) ? a.slice() : Object.assign({}, a || {});
    for (const [k, v] of Object.entries(b || {})) {
      if (v && typeof v === "object" && !Array.isArray(v) && o[k] && typeof o[k] === "object" && !Array.isArray(o[k])) o[k] = merge(o[k], v);
      else o[k] = v;
    }
    return o;
  };
  const newId = () => Array.from(crypto.getRandomValues(new Uint8Array(15)), b => "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"[b % 62]).join("");

  function docSnap(path) {
    const d = docs.get(path);
    return { id: idOf(path), exists: d != null, data: () => clone(d), metadata: { hasPendingWrites: pending.has(path), fromCache: false } };
  }
  function colSnap(path, q) {
    const c = cols.get(path); let ids = c ? [...c.ids] : [];
    let rows = ids.map(id => ({ id, d: docs.get(path + "/" + id) })).filter(x => x.d != null);
    for (const [f, op, v] of q.where) {
      rows = rows.filter(x => op === "array-contains" ? Array.isArray(x.d[f]) && x.d[f].includes(v) : op === "==" ? x.d[f] === v : true);
    }
    if (q.order) { const [f, dir] = q.order; rows.sort((a, b) => ((a.d[f] ?? 0) > (b.d[f] ?? 0) ? 1 : (a.d[f] ?? 0) < (b.d[f] ?? 0) ? -1 : a.id < b.id ? -1 : 1) * (dir === "desc" ? -1 : 1)); }
    if (q.limit) rows = rows.slice(0, q.limit);
    const list = rows.map(x => docSnap(path + "/" + x.id));
    return { docs: list, size: list.length, empty: !list.length, docChanges: () => [], metadata: { hasPendingWrites: list.some(d => d.metadata.hasPendingWrites), fromCache: false } };
  }
  function fire(path) {
    (docSubs.get(path) || []).forEach(fn => { try { fn(docSnap(path)); } catch (e) { console.error(e); } });
    const col = parentOf(path);
    colSubs.forEach(s => { if (s.path === col && cols.get(col)?.loaded) { try { s.fn(colSnap(s.path, s.q)); } catch (e) { console.error(e); } } });
  }
  function putDoc(path, data) {
    if (data == null) docs.set(path, null); else docs.set(path, data);
    const c = cols.get(parentOf(path));
    if (c) { if (data == null) c.ids.delete(idOf(path)); else c.ids.add(idOf(path)); }
  }

  /* batch reads into one request */
  let readQ = [], readTimer = null;
  function queueRead(op) {
    return new Promise((res, rej) => {
      readQ.push({ op, res, rej });
      if (!readTimer) readTimer = setTimeout(flushReads, 15);
    });
  }
  async function flushReads() {
    const q = readQ; readQ = []; readTimer = null;
    for (let i = 0; i < q.length; i += 40) {
      const part = q.slice(i, i + 40);
      try {
        const r = await call("db", { ops: part.map(x => x.op) });
        part.forEach((x, j) => { const v = r.results[j] || {}; v.error ? x.rej({ code: "invalid_argument", message: v.message || "You can't see that." }) : x.res(v); });
      } catch (e) { part.forEach(x => x.rej(e)); }
    }
  }
  async function loadDoc(path) {
    if (docs.has(path)) return;
    const r = await queueRead({ op: "get", path }).catch(() => ({ data: null }));
    if (!docs.has(path) || !pending.has(path)) docs.set(path, r.data ?? null);
  }
  function loadCol(path, limit) {
    let c = cols.get(path);
    if (!c) { c = { ids: new Set(), loaded: false, limit: 0 }; cols.set(path, c); }
    if (c.loaded && (!limit || c.limit === 0 || limit <= c.limit)) return Promise.resolve();
    if (c.loading && (!limit || limit <= c.want)) return c.loading;
    c.want = limit || 0;
    c.loading = queueRead({ op: "list", path, limit: limit || undefined }).then(r => {
      for (const d of r.docs || []) { if (!pending.has(path + "/" + d.id)) docs.set(path + "/" + d.id, d.data); c.ids.add(d.id); }
      c.loaded = true; c.limit = limit || 0;
    }).catch(() => { c.loaded = true; }).finally(() => { c.loading = null; });
    return c.loading;
  }

  /* batch writes into one request */
  let writeQ = [], writeTimer = null;
  function queueWrite(entry) {
    return new Promise((res, rej) => {
      writeQ.push(Object.assign({ res, rej }, entry));
      if (!writeTimer) writeTimer = setTimeout(flushWrites, 20);
    });
  }
  async function flushWrites() {
    const q = writeQ; writeQ = []; writeTimer = null;
    let r;
    try { r = await call("db", { ops: q.map(x => x.op) }); }
    catch (e) { q.forEach(x => { pending.delete(x.op.path); revert(x.op.path, x.prev); x.rej({ code: e.status === 429 ? "quota_exceeded" : "invalid_argument", message: e.message }); }); return; }
    q.forEach((x, j) => {
      const v = r.results[j] || {};
      pending.delete(x.op.path);
      if (v.error) { revert(x.op.path, x.prev); x.rej({ code: "invalid_argument", message: v.message || "You can't do that." }); }
      else { if (!v.skipped && x.op.op !== "delete" && v.data) putDoc(x.op.path, v.data); fire(x.op.path); x.res(); }
    });
    soon(250);
    fastSend({ t: "poke" });
  }
  function revert(path, prev) { putDoc(path, prev === undefined ? null : prev); fire(path); }
  async function write(op, path, data) {
    if (!docs.has(path) && op === "update") await loadDoc(path);
    const prev = docs.has(path) ? clone(docs.get(path)) : undefined;
    const next = op === "delete" ? null : op === "update" ? merge(docs.get(path) || {}, clone(data)) : clone(data);
    putDoc(path, next); pending.add(path); fire(path);
    return queueWrite({ op: { op, path, data: op === "delete" ? undefined : clone(data) }, prev });
  }

  function makeQuery(path, q = { where: [], order: null, limit: 0 }) {
    const ext = o => makeQuery(path, Object.assign({}, q, o));
    return {
      path,
      orderBy: (f, dir) => ext({ order: [f, dir || "asc"] }),
      limit: n => ext({ limit: n }),
      where: (f, op, v) => ext({ where: q.where.concat([[f, op, v]]) }),
      onSnapshot(next, err) {
        const s = { path, q, fn: next };
        colSubs.add(s);
        loadCol(path, q.limit && q.order ? q.limit : 0).then(() => { if (colSubs.has(s)) next(colSnap(path, q)); }, e => err && err(e));
        return () => colSubs.delete(s);
      },
      async get() { await loadCol(path, q.limit && q.order ? q.limit : 0); return colSnap(path, q); },
      doc: id => makeDoc(path + "/" + (id || newId())),
      async add(data) { const r = makeDoc(path + "/" + newId()); await r.set(data); return r; }
    };
  }
  function makeDoc(path) {
    return {
      id: idOf(path), path,
      async get() { await loadDoc(path); return docSnap(path); },
      set: d => write("set", path, d),
      update: d => write("update", path, d),
      delete: () => write("delete", path),
      onSnapshot(next, err) {
        if (!docSubs.has(path)) docSubs.set(path, new Set());
        docSubs.get(path).add(next);
        loadDoc(path).then(() => { if (docSubs.get(path)?.has(next)) next(docSnap(path)); }, e => err && err(e));
        return () => docSubs.get(path)?.delete(next);
      },
      collection: sub => makeQuery(path + "/" + sub)
    };
  }
  const db = { doc: makeDoc, collection: p => makeQuery(p) };

  /* ---------------- live updates (polling) ---------------- */
  const conn = newId().slice(0, 16);
  let cursor = null, timer = null, busy = false, lastActive = Date.now(), lastBeat = 0, lastPeers = 0;
  let presState = null, presDirty = false, emitQ = [], again = false;
  let peers = []; const peerFns = new Set(), evFns = new Map();
  ["pointerdown", "keydown", "touchstart", "focus"].forEach(t => addEventListener(t, () => { const idle = Date.now() - lastActive > 60000; lastActive = Date.now(); if (idle) soon(50); }, { passive: true }));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { lastActive = Date.now(); soon(50); } });
  function interval() {
    if (document.hidden) return 30000;
    return Date.now() - lastActive < 60000 ? 2500 : 8000;
  }
  function soon(ms) { if (!me) return; clearTimeout(timer); timer = setTimeout(tick, ms); }
  async function tick() {
    if (!me) return;
    if (busy) { again = true; return; }
    busy = true; clearTimeout(timer);
    const now = Date.now();
    const body = { cursor, conn };
    if (presDirty && presState) { body.pres = presState; presDirty = false; }
    else if (presState && now - lastBeat > 40000) body.beat = true;
    if (body.pres || body.beat) lastBeat = now;
    if (now - lastPeers > 60000) { body.peers = true; lastPeers = now; }
    if (emitQ.length) { body.emits = emitQ.splice(0, 10); }
    try {
      const r = await call("sync", body);
      if (cursor !== null && r.reset) await reloadAll();
      cursor = r.seq;
      for (const ch of r.changes || []) { if (pending.has(ch.path)) continue; putDoc(ch.path, ch.data); fire(ch.path); }
      if (r.peers) setPeers(r.peers);
      for (const e of r.events || []) deliver(e);
    } catch (e) { if (body.pres) presDirty = true; if (body.emits) emitQ.unshift(...body.emits); }
    busy = false;
    if (again || emitQ.length || presDirty) { again = false; timer = setTimeout(tick, 120); }
    else timer = setTimeout(tick, interval());
  }
  async function reloadAll() {
    const docPaths = [...docSubs.keys()].filter(p => docSubs.get(p).size);
    docPaths.forEach(p => { if (!pending.has(p)) docs.delete(p); });
    const colPaths = [...cols.keys()];
    colPaths.forEach(p => { const c = cols.get(p); c.loaded = false; c.ids = new Set(); });
    await Promise.all([...docPaths.map(loadDoc), ...colPaths.map(p => loadCol(p, cols.get(p).want || 0))]);
    docPaths.forEach(fire);
    colSubs.forEach(s => { try { s.fn(colSnap(s.path, s.q)); } catch (e) {} });
  }
  function setPeers(list) {
    peers = list.map(x => ({ peer: x.peer, by: x.by, presence: x.presence || {}, isMe: x.by === me.uid, sameTab: x.peer === conn, kind: "viewer", guest: false, updatedAt: x.t || 0 }));
    fastConnect();
    peerFns.forEach(fn => { try { fn({ peers, joined: [], left: [], updated: [] }); } catch (e) { console.error(e); } });
  }
  const seenEv = new Set();
  function deliver(e) {
    if (e.eid) { if (seenEv.has(e.eid)) return; seenEv.add(e.eid); if (seenEv.size > 500) seenEv.delete(seenEv.values().next().value); }
    (evFns.get(e.topic) || []).forEach(fn => { try { fn({ topic: e.topic, data: e.data, by: e.by, peer: e.peer, isMe: e.by === me.uid, sameTab: e.peer === conn, kind: "viewer", guest: false }); } catch (x) { console.error(x); } });
  }
  addEventListener("pagehide", () => {
    if (!me || !token) return;
    try { fetch("/api/sync", { method: "POST", keepalive: true, headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify({ conn, leave: true }) }); } catch (e) {}
  });
  const room = {
    presence: async patch => {
      presState = Object.assign({}, presState || {});
      for (const [k, v] of Object.entries(patch || {})) { if (v === null) delete presState[k]; else presState[k] = v; }
      presDirty = true; soon(80);
    },
    peers: () => peers,
    onPeers: fn => { peerFns.add(fn); setTimeout(() => fn({ peers, joined: peers, left: [], updated: [] }), 0); return () => peerFns.delete(fn); },
    emit: async (topic, data) => {
      const d = data === undefined ? null : data, eid = newId().slice(0, 16);
      emitQ.push({ topic, data: d, eid });
      fastSend({ t: "ev", topic, data: d, eid, peer: conn });
      soon(fast.conns.size ? 400 : 60);
    },
    on: (topic, fn) => { if (!evFns.has(topic)) evFns.set(topic, new Set()); evFns.get(topic).add(fn); return () => evFns.get(topic).delete(fn); },
    connected: () => true,
    onConnection: fn => { setTimeout(() => fn(true), 0); return () => {}; }
  };

  /* ---------------- fast lane: browsers poke each other directly (free, via PeerJS) ----------------
     A poke only means "something changed, check now", and typing/voice events are only trusted from a
     peer whose id the server's online list ties to a real account. Everything still goes through the server. */
  const fast = { peer: null, id: null, conns: new Map(), lastPoke: 0, tries: 0 };
  function fastStart() {
    if (fast.peer || !me) return;
    if (!window.Peer) { if (fast.tries++ < 40) setTimeout(fastStart, 1000); return; }
    try {
      const p = new window.Peer("gyf-" + newId().slice(0, 14), { debug: 0 });
      fast.peer = p;
      p.on("open", pid => { fast.id = pid; room.presence({ fp: pid }); fastConnect(); });
      p.on("connection", c => fastWire(c));
      p.on("disconnected", () => { try { p.reconnect(); } catch (e) {} });
      p.on("error", () => {});
    } catch (e) { fast.peer = null; }
  }
  function fastWire(c) {
    c.on("open", () => { fast.conns.set(c.peer, c); });
    c.on("data", d => fastRecv(c.peer, d));
    c.on("close", () => { if (fast.conns.get(c.peer) === c) fast.conns.delete(c.peer); });
    c.on("error", () => { if (fast.conns.get(c.peer) === c) fast.conns.delete(c.peer); });
  }
  function fastConnect() {
    if (!fast.peer || !fast.id) return;
    const want = new Set();
    for (const x of peers) {
      const fp = x.presence && x.presence.fp;
      if (!fp || fp === fast.id || x.sameTab || typeof fp !== "string" || !/^gyf-[A-Za-z0-9]{6,20}$/.test(fp)) continue;
      want.add(fp);
      if (fast.conns.has(fp) || fast.id > fp || fast.conns.size >= 30) continue; // the smaller id dials, so each pair connects once
      try { const c = fast.peer.connect(fp, { reliable: true }); fastWire(c); fast.conns.set(fp, c); } catch (e) {}
    }
    for (const [fp, c] of fast.conns) if (!want.has(fp) && c.open) { try { c.close(); } catch (e) {} fast.conns.delete(fp); }
  }
  function fastSend(msg) {
    for (const c of fast.conns.values()) if (c.open) { try { c.send(msg); } catch (e) {} }
  }
  function fastRecv(pid, d) {
    if (!d || typeof d !== "object") return;
    if (d.t === "poke") {
      const now = Date.now();
      if (now - fast.lastPoke > 150) { fast.lastPoke = now; soon(0); } else soon(160);
    } else if (d.t === "ev" && typeof d.topic === "string" && typeof d.eid === "string") {
      const who = peers.find(x => x.presence && x.presence.fp === pid);
      if (!who || who.isMe) return;
      if (JSON.stringify(d.data || null).length > 4000) return;
      deliver({ topic: d.topic.slice(0, 30), data: d.data, by: who.by, peer: who.peer, eid: d.eid.slice(0, 24), t: Date.now() });
    }
  }
  addEventListener("pagehide", () => { try { fast.peer && fast.peer.destroy(); } catch (e) {} });

  /* ---------------- pictures ---------------- */
  async function shrink(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      let max = 1280, q = 0.8, out = "";
      for (let tries = 0; tries < 7; tries++) {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
        const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length < 560000) return out;
        max = Math.round(max * 0.75); q = Math.max(0.5, q - 0.08);
      }
      return out;
    } finally { URL.revokeObjectURL(url); }
  }
  const assets = {
    async upload(file) {
      if (!file || !/^image\//.test(file.type)) throw { code: "unsupported_type" };
      const data = (file.size <= 480 * 1024 && /^image\/(png|jpeg|webp|gif)$/.test(file.type)) ? await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }) : await shrink(file);
      if (data.length > 690000) throw { code: "too_large" };
      try { return await call("upload", { data }); }
      catch (e) { throw { code: e.status === 413 ? "too_large" : e.status === 429 ? "quota_exceeded" : "invalid_argument", message: e.message }; }
    }
  };
  const getImage = async id => /^[0-9a-f]{32}$/.test(String(id)) ? "/api/img?id=" + id : null;

  /* ---------------- who is viewing ---------------- */
  const user = {
    id: async () => me && me.uid,
    isOwner: async () => !!(me && me.owner),
    canEdit: async () => !!(me && me.owner),
    can: async () => true,
    me: async () => ({ id: me && me.uid, name: "", email: me && me.email })
  };
  const caps = { db, user, room, assets };
  window.claude = { use: async name => (me ? (caps[name] ?? null) : null) };

  /* ---------------- accounts ---------------- */
  const authFns = new Set();
  function setSession(s) {
    token = s.token; ls.set(TOKEN_KEY, token);
    const changed = !me || me.uid !== s.uid;
    me = { uid: s.uid, email: s.email, owner: !!s.owner };
    if (changed) { authFns.forEach(fn => fn({ uid: me.uid, email: me.email })); soon(10); fastStart(); }
  }
  const auth = (action, extra) => call("auth", Object.assign({ action }, extra || {}));

  let started = null;
  function start() {
    if (!started) started = (async () => {
      if (!token) return null;
      try { const s = await auth("me"); setSession(s); return me; }
      catch (e) { if (e.status === 401) { token = null; ls.set(TOKEN_KEY, null); } else if (e.status === 503) throw e; return null; }
    })();
    return started;
  }

  function ready(api) { window.YAPPS = api; (window.__yappsReady || (() => {}))(); }
  const API = {
    mode: "firebase", kind: "vercel",
    onAuth(cb) {
      authFns.add(cb);
      start().then(u => { if (!u) cb(null); }, () => cb(null));
      return () => authFns.delete(cb);
    },
    email: () => me && me.email,
    async signUp(email, password) { const s = await auth("signup", { email, password }); setSession(s); return s.uid; },
    async logIn(email, password, code) {
      const s = await auth("login", { email, password, code });
      if (s.need2fa) throw { code: "need2fa", message: "Type the 6-digit code from your authenticator app." };
      setSession(s); return s.uid;
    },
    async logOut() {
      try { if (token) await fetch("/api/sync", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify({ conn, leave: true }) }); } catch (e) {}
      token = null; ls.set(TOKEN_KEY, null); me = null;
    },
    async resetWithCode(email, code, password) { const s = await auth("reset", { email, code, password }); setSession(s); return s.uid; },
    async changePassword(old, password) { const s = await auth("change", { old, password }); setSession(s); },
    async makeResetCode(name) { return auth("resetCode", { name }); },
    turn: (() => { let p = null; return () => (p = p || auth("turn").then(r => r.iceServers).catch(e => { p = null; throw e; })); })(),
    async resetPassword() { throw { code: "use_code", message: "Ask the owner for a reset code." }; },
    async deleteUser() { await auth("delete"); token = null; ls.set(TOKEN_KEY, null); me = null; },
    async joinServer(code) {
      const r = await call("db", { ops: [{ op: "joinServer", code }] });
      const v = r.results[0] || {};
      if (v.error) throw { code: v.error, message: v.message };
      soon(50);
      return v;
    },
    getImage
  };

  // Check the server is set up before showing the app.
  fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json" }, body: '{"action":"ping"}' })
    .then(async r => {
      if (r.status === 503) { const j = await r.json().catch(() => ({})); ready({ mode: "demo", setup: true, error: j.message || "The database isn't connected yet." }); }
      else if (r.status === 404) ready({ mode: "demo", error: "The server code (the api folder) wasn't found." });
      else ready(API);
    })
    .catch(() => ready({ mode: "demo", error: "Can't reach the server." }));
})();

</script>

.feed{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:2px}
.welcome{padding:8px 0 18px;border-bottom:1px solid var(--vine);margin-bottom:10px}
.welcome .big{width:68px;height:68px;border-radius:50%;background:var(--leaf);display:grid;place-items:center;font-family:var(--display);font-size:32px;margin-bottom:10px}
.welcome h2{font-family:var(--pixel);font-weight:700;font-size:30px;margin:0 0 4px;text-wrap:balance}
.welcome p{margin:0;color:var(--fog-dim);max-width:60ch;line-height:1.45}
.day{display:flex;align-items:center;gap:10px;color:var(--fog-faint);font-size:12px;font-weight:900;margin:14px 0 6px}
.day::before,.day::after{content:"";flex:1;border-top:1px solid var(--vine)}
.msg{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:12px;padding:5px 8px;border-radius:6px;position:relative}
.msg:hover,.msg:focus-within{background:var(--hover)}
.msg.mention{background:var(--mention-soft);box-shadow:inset 3px 0 0 var(--mention)}
.msg.flash{animation:flash 1.4s}
@keyframes flash{0%,40%{background:var(--lava-soft)}}
.msg.cont{padding-top:1px;padding-bottom:1px}
.msg.cont>.av{visibility:hidden;height:0}
.msg .av{cursor:pointer}
.msg .who{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg .who b{font-weight:900;cursor:pointer}
.msg .who b:hover{text-decoration:underline}
.lvl{font-size:10px;font-weight:900;padding:1px 5px;border-radius:4px;background:var(--leaf);color:var(--you)}
.msg .who time{font-size:12px;color:var(--fog-faint)}
.msg .text{line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}
.msg .text .at{background:var(--lava-soft);color:var(--lava);font-weight:900;border-radius:4px;padding:0 3px}
.msg .text code{font-family:var(--mono);font-size:13px;background:var(--canopy);padding:1px 5px;border-radius:4px}
.msg .edited{font-size:11px;color:var(--fog-faint)}
.msg.pending .text{opacity:.55}
.reply-to{grid-column:2;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fog-dim);margin-bottom:2px;cursor:pointer;min-width:0;position:relative}
.reply-to::before{content:"";position:absolute;left:-34px;top:9px;width:28px;height:10px;border-left:2px solid var(--vine-hi);border-top:2px solid var(--vine-hi);border-radius:8px 0 0 0}
.reply-to b{color:var(--fog);flex:none}
.reply-to span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pin-flag{font-size:11px;color:var(--you);font-weight:900}
.msg img.shot{display:block;max-width:min(360px,100%);max-height:320px;border-radius:10px;margin-top:6px;border:1px solid var(--vine);background:var(--canopy)}
.sticker{width:150px;margin-top:4px;user-select:none}
.sticker svg{width:100%;height:auto;display:block}
.tools{position:absolute;right:8px;top:-16px;display:none;gap:1px;background:var(--bark);border:1px solid var(--vine);border-radius:8px;padding:2px;z-index:2;box-shadow:0 4px 12px #0006}
.msg:hover .tools,.msg:focus-within .tools{display:flex}
.tools button{width:30px;height:28px;border-radius:6px;font-size:14px}
.tools button:hover{background:var(--leaf)}
.tools .del:hover{background:#ff5a5a33}
@media (hover:none){.tools{display:flex;position:static;grid-column:2;justify-self:start;margin-top:4px;box-shadow:none;opacity:.8}}
.reacts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.react{font-size:13px;padding:2px 8px;border-radius:8px;background:var(--leaf);border:1px solid var(--vine);font-variant-numeric:tabular-nums;font-weight:800}
.react.mine{border-color:var(--lava);background:var(--lava-soft)}
.edit-form{display:flex;flex-direction:column;gap:4px}
.edit-form input{background:var(--canopy);border:2px solid var(--vine);border-radius:8px;padding:8px 10px}
.edit-form small{color:var(--fog-faint);font-size:12px}
.empty-feed{color:var(--fog-dim);padding:6px 8px}
.typing{height:22px;padding:0 16px;font-size:13px;color:var(--fog-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.compose{padding:0 16px 14px}
.replybar{display:flex;align-items:center;gap:8px;background:var(--bark);border-radius:10px 10px 0 0;padding:8px 10px 8px 14px;font-size:13px;color:var(--fog-dim)}
.replybar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.replybar b{color:var(--fog)}
.replybar+form{border-top-left-radius:0;border-top-right-radius:0}
.compose form{display:flex;gap:4px;background:var(--leaf);border-radius:10px;padding:5px;align-items:center}
.compose input,.compose textarea{flex:1;min-width:0;background:none;border:0;padding:8px 6px}
.compose textarea{resize:none;line-height:1.4;max-height:40vh;overflow-y:auto;font:inherit;color:var(--fog);display:block;height:37px}
.compose input::placeholder,.compose textarea::placeholder{color:var(--fog-faint)}
.compose input:focus-visible,.compose textarea:focus-visible{outline:none}
.compose form{align-items:flex-end}
.char-count{font-size:12px;font-weight:700;color:var(--fog-faint);font-variant-numeric:tabular-nums}
.char-count.low{color:var(--danger)}
.practice{display:flex;align-items:center;gap:8px;margin:8px 12px 0;padding:8px 8px 8px 12px;border-radius:10px;background:#ffd23f33;border:2px solid #e0a21c;font-size:13px;line-height:1.4}
.practice span{flex:1;min-width:0}
.chat.drop-on::after{content:"Drop your picture to send it 📸";position:absolute;inset:8px;border:3px dashed var(--lava);border-radius:14px;background:#ff6a2b1a;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--lava);z-index:20;pointer-events:none}
.spoiler{background:var(--fog);color:transparent;border-radius:4px;padding:0 3px;cursor:pointer;transition:color .15s,background .15s}
.spoiler *{visibility:hidden}
.spoiler.shown{background:var(--leaf);color:inherit;cursor:text}
.spoiler.shown *{visibility:visible}
.md-quote{display:block;border-left:4px solid var(--vine-hi);padding:0 0 0 10px;margin:2px 0;color:var(--fog-dim)}
.md-h{display:block;font-family:var(--display);font-weight:400;line-height:1.2;margin:4px 0 2px}
.md-h1{font-size:1.6em}.md-h2{font-size:1.35em}.md-h3{font-size:1.15em}
.md-sub{display:block;font-size:.8em;color:var(--fog-faint)}
.md-li{display:block;padding-left:18px;position:relative}
.md-li::before{content:"•";position:absolute;left:5px;color:var(--fog-dim)}
.md-code{white-space:pre-wrap;font-family:var(--mono);font-size:13px;background:var(--canopy);border:1px solid var(--vine);border-radius:8px;padding:8px 10px;margin:4px 0;overflow-x:auto;max-width:100%}
.md-code code{background:none!important;padding:0!important}
.emoji-pop{position:fixed;z-index:48;max-height:min(380px,60vh);display:flex;flex-direction:column;background:var(--bark);border:1px solid var(--vine);border-radius:12px;box-shadow:0 10px 30px #0005;overflow:hidden}
.ep-search{margin:8px;background:var(--canopy);border:2px solid var(--vine);border-radius:8px;padding:8px 10px}
.ep-search:focus-visible{outline:none;border-color:var(--lava)}
.ep-body{overflow-y:auto;padding:0 8px 8px}
.ep-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--fog-faint);padding:8px 2px 4px;position:sticky;top:0;background:var(--bark)}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:2px}
.ep-grid button{height:36px;border-radius:8px;font-size:22px;display:grid;place-items:center}
.ep-grid button:hover{background:var(--leaf)}
.ep-grid .cemoji{width:26px;height:26px;vertical-align:0}
.compose form:focus-within{box-shadow:0 0 0 2px var(--vine-hi)}
.send{background:var(--lava);color:var(--lava-ink);font-family:var(--display);font-size:16px;padding:8px 14px;border-radius:8px}
.hint{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.hint button{font-size:13px;font-weight:800;padding:4px 10px;border-radius:14px;background:var(--bark);border:1px solid var(--vine);color:var(--fog-dim)}
.hint button:hover{color:var(--fog);border-color:var(--lava)}
.hint small{color:var(--fog-faint);font-size:12px;margin-left:auto}
.tray{position:absolute;left:16px;right:16px;bottom:100%;margin-bottom:8px;background:var(--bark);border:1px solid var(--vine);border-radius:12px;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:300px;overflow-y:auto;box-shadow:0 8px 24px #0008;z-index:5}
.tray button{border-radius:10px;padding:6px;background:var(--moss)}
.tray button:hover{background:var(--leaf)}
.tray svg{width:100%;height:auto;display:block}
.compose-wrap{position:relative}
.readonly{padding:12px 14px;border-radius:10px;background:var(--leaf);color:var(--fog-dim);font-size:14px}
.cmds{position:absolute;left:0;right:0;bottom:100%;margin-bottom:6px;background:var(--bark);border:1px solid var(--vine);border-radius:10px;padding:6px;z-index:5}
.cmds button{display:flex;gap:10px;width:100%;text-align:left;padding:6px 8px;border-radius:6px}
.cmds button:hover,.cmds button.sel{background:var(--leaf)}
.cmds b{font-family:var(--mono);font-size:13px;color:var(--you)}
.cmds span{color:var(--fog-dim);font-size:13px}

.troop{background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);overflow-y:auto;padding:12px 10px 16px}
.troop .cat{padding-top:8px}
.member{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;min-width:0;width:100%;text-align:left}
.member:hover{background:var(--leaf)}
.member .m-info{min-width:0;flex:1}
.member b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member small{font-size:12px;color:var(--fog-dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member.off{opacity:.45}
.you-tag{font-size:10px;font-weight:900;color:var(--you);margin-left:4px}
.board{background:var(--moss);border-radius:10px;padding:8px;margin-bottom:6px}
.board-row{display:grid;grid-template-columns:18px 24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px;font-size:13px;font-weight:800;width:100%;text-align:left;border-radius:6px}
.board-row:hover{background:var(--leaf)}
.board-row .rank{color:var(--fog-faint);font-variant-numeric:tabular-nums;text-align:center}
.board-row span:nth-child(3){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-row .b{color:var(--you);font-variant-numeric:tabular-nums}

.av{width:40px;height:40px;position:relative;flex:none}
.av svg{width:100%;height:100%;display:block}
.av.sm{width:32px;height:32px}.av.xs{width:20px;height:20px}.av.lg{width:60px;height:60px}.av.xl{width:96px;height:96px}
.av .av-img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--leaf)}
.av .av-img+svg{display:none}.av .av-img.broken{display:none}.av .av-img.broken+svg{display:block}
.deco{position:absolute;inset:-9%;border-radius:50%;pointer-events:none;padding:8%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.av.xs .deco{display:none}
.deco-leafring{background:repeating-conic-gradient(#3f9a4a 0 14deg,#7bd36b 14deg 22deg,#2c6e35 22deg 30deg);animation:decoSpin 14s linear infinite}
.deco-lavaring{background:conic-gradient(#ff6a2b,#ffd23f,#ff3d00,#ffb02b,#ff6a2b);animation:decoSpin 3s linear infinite;filter:drop-shadow(0 0 4px #ff6a2b)}
.deco-frostring{background:conic-gradient(#e8fbff,#8fdcff,#ffffff,#5bb8ff,#e8fbff);animation:decoSpin 6s linear infinite;filter:drop-shadow(0 0 3px #8fdcff)}
.deco-bananaring{background:repeating-conic-gradient(#ffd23f 0 18deg,#fff1a8 18deg 24deg,#e0a21c 24deg 36deg);animation:decoSpin 9s linear infinite reverse}
.deco-rainbowring{background:conic-gradient(#ff4d4d,#ffb02b,#ffe04d,#5fd068,#4dc3ff,#7b6bff,#ff5fd2,#ff4d4d);animation:decoSpin 4s linear infinite;filter:drop-shadow(0 0 3px #ff5fd288)}
.deco-flowerring{background:repeating-conic-gradient(#ff8fc8 0 20deg,#fff 20deg 30deg,#ffd23f 30deg 36deg);animation:decoSpin 12s linear infinite}
.deco-slimering{background:conic-gradient(#6fdc3a,#2fae4a,#a6ff00,#2fae4a,#6fdc3a);animation:decoSpin 5s linear infinite;filter:drop-shadow(0 0 3px #6fdc3a)}
.deco-heartring{background:repeating-conic-gradient(#ff3d6e 0 15deg,#ff9ec4 15deg 30deg);animation:decoSpin 8s linear infinite;filter:drop-shadow(0 0 3px #ff3d6e88)}
.deco-electricring{background:conic-gradient(#2bf0ff,#fff,#4a6bff,#ffe04d,#2bf0ff);animation:decoSpin 1.2s linear infinite,decoFlicker 1.7s steps(3) infinite;filter:drop-shadow(0 0 5px #2bf0ff)}
.deco-galaxyring{background:conic-gradient(#2a1250,#7b3fe4,#e355aa,#3f9ce3,#2a1250);animation:decoSpin 6s linear infinite;filter:drop-shadow(0 0 4px #7b3fe4)}
.deco-auraring{background:conic-gradient(#fff3b0,#ffd23f,#e0a21c,#fff3b0,#ffd23f,#fff3b0);animation:decoSpin 4s linear infinite,decoPulse 2s ease-in-out infinite;filter:drop-shadow(0 0 6px #ffd23f)}
@keyframes decoFlicker{50%{opacity:.6}}
@keyframes decoPulse{50%{filter:drop-shadow(0 0 12px #ffd23f)}}
@keyframes decoSpin{to{transform:rotate(360deg)}}
.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3;border-radius:inherit}
.fx i{position:absolute;top:-12%;left:calc(var(--i) * 8.4% - 2%);font-style:normal;font-size:16px;animation:fxFall 5s linear infinite;animation-delay:calc(var(--i) * -0.43s);opacity:.9}
.fx i:nth-child(odd){font-size:12px;animation-duration:6.5s}
@keyframes fxFall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(520px) rotate(320deg)}}
.fx-bubbles i,.fx-embers i,.fx-hearts i{top:auto;bottom:-12%;animation-name:fxRise}
@keyframes fxRise{0%{transform:translateY(0) scale(.8);opacity:0}15%{opacity:.95}100%{transform:translateY(-520px) scale(1.15);opacity:0}}
.fx-stars i{animation-name:fxShoot;animation-duration:3.2s}
@keyframes fxShoot{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(-180px,420px);opacity:0}}
@media (prefers-reduced-motion:reduce){.fx{display:none}}
@media (prefers-reduced-motion:reduce){.deco{animation:none!important}}
.media-prev{position:relative;padding-bottom:44px}
.media-prev .mp-banner{height:120px;background-color:var(--leaf)}
.media-prev .av.xl{position:absolute;left:16px;bottom:0;border-radius:50%;background:var(--canopy);padding:5px;width:100px;height:100px}
.row-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.row-btns input[type=color]{width:38px;height:34px;border:2px solid var(--vine);border-radius:8px;background:var(--canopy);padding:2px;cursor:pointer}
.mp-status{padding:0 16px;font-weight:600;font-size:14px}
.mp-status:empty{display:none}
.mp-status.bad{color:var(--danger)}.mp-status.good{color:var(--online)}
.mp-status.busy::before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-1px;border-radius:50%;border:2px solid var(--vine);border-top-color:var(--lava);animation:spin .8s linear infinite}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--online);border:3px solid var(--bark)}
.av .dot.idle{background:var(--idle)}.av .dot.dnd{background:var(--dnd)}.av .dot.invisible{background:var(--fog-faint)}

/* modal, popover, toast */
.modal{position:fixed;inset:0;z-index:55;background:#000b;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.modal .card{width:min(500px,100%);max-height:100%;overflow-y:auto}
.modal h2{margin:0;font-family:var(--pixel);font-weight:700;font-size:24px}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.danger-btn{color:var(--danger);font-weight:900;padding:8px 10px;border-radius:8px}
.danger-btn:hover{background:#ff5a5a22}
.profile-card{padding:0;overflow:hidden}
.profile-card .banner{height:80px}
.profile-card .pc-body{padding:0 20px 20px;display:flex;flex-direction:column;gap:12px}
.profile-card .av.xl{margin-top:-52px;border-radius:50%;background:var(--bark);padding:5px;width:106px;height:106px}
.pc-name{font-family:var(--pixel);font-weight:700;font-size:28px;line-height:1}
.pc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc-stats div{background:var(--moss);border-radius:10px;padding:8px 10px}
.pc-stats b{display:block;font-family:var(--display);font-size:20px;font-weight:400;font-variant-numeric:tabular-nums}
.pc-stats small{color:var(--fog-dim);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.pc-bio{background:var(--moss);border-radius:10px;padding:10px 12px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.pin-list{display:flex;flex-direction:column;gap:8px}
.pin-item{background:var(--moss);border-radius:10px;padding:10px;text-align:left;display:flex;gap:10px;width:100%}
.pin-item:hover{background:var(--leaf)}
.pin-item div{min-width:0}
.pin-item p{margin:2px 0 0;color:var(--fog-dim);overflow-wrap:anywhere}
.pop{position:fixed;z-index:45;background:var(--bark);border:1px solid var(--vine);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(8,34px);gap:2px;box-shadow:0 8px 24px #0009}
.pop button{height:34px;border-radius:6px;font-size:18px}
.pop button:hover{background:var(--leaf)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  background:var(--fog);color:var(--canopy);font-weight:900;padding:10px 16px;border-radius:10px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px #0008}
.toast.big{background:var(--banana);color:var(--lava-ink);font-family:var(--display);font-weight:400;font-size:20px}

/* wooden signs */
.sign{display:inline-block;font-family:var(--display);font-weight:400;color:var(--wood-ink);text-shadow:0 2px 0 var(--wood-dark);
  background:repeating-linear-gradient(0deg,transparent 0 7px,#00000012 7px 8px),linear-gradient(180deg,var(--wood-light),var(--wood));
  border:2px solid var(--wood-dark);border-radius:9px;padding:3px 16px;box-shadow:0 3px 0 var(--wood-dark),0 6px 14px #6b412233;position:relative;max-width:100%}
.sign::before,.sign::after{content:"";position:absolute;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--wood-dark);box-shadow:inset 1px 1px 0 #ffffff55}
.sign::before{left:5px}.sign::after{right:5px}
.logo.sign{transform:rotate(-2deg);border-width:3px;border-radius:14px;box-shadow:0 6px 0 var(--wood-dark),0 14px 30px #6b412244}
.topbar h1.sign{font-size:18px;padding:3px 16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-head.has-banner .t .sign{font-size:19px;color:var(--wood-ink);text-shadow:0 2px 0 var(--wood-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.troop .cat .sign,.chans .cat .sign{font-size:11px;letter-spacing:.08em;padding:1px 12px;font-family:var(--body);font-weight:700;border-width:1.5px;box-shadow:0 2px 0 var(--wood-dark)}
.troop .cat .sign::before,.troop .cat .sign::after,.chans .cat .sign::before,.chans .cat .sign::after{width:3px;height:3px;margin-top:-1.5px;left:3px}
.troop .cat .sign::after,.chans .cat .sign::after{left:auto;right:3px}
.welcome h2.sign{font-size:24px;padding:4px 18px;margin-bottom:8px;transform:rotate(-1deg)}
/* tagged! */
.msg.mention{background:linear-gradient(90deg,#ff6a2b24,#ff6a2b05 70%);box-shadow:inset 4px 0 0 var(--lava),0 0 0 1px #ff6a2b55,0 0 16px #ff6a2b44;animation:lavaGlow 1.6s ease-in-out infinite alternate}
@keyframes lavaGlow{to{box-shadow:inset 4px 0 0 var(--lava-hot),0 0 0 1px #ff6a2b99,0 0 26px #ff6a2b77}}
.tagged{font-family:var(--display);font-weight:400;font-size:11px;letter-spacing:.06em;color:#fff;background:linear-gradient(180deg,var(--lava-hot),var(--lava) 60%,#d8410f);padding:1px 7px;border-radius:6px;text-shadow:0 1px 0 #8a2a00;box-shadow:0 0 10px #ff6a2b88}
.lava-flash{position:fixed;inset:0;z-index:70;pointer-events:none;display:grid;place-items:center;box-shadow:inset 0 0 90px 30px #ff6a2bcc;animation:flashOut 1.6s ease-out forwards}
.lava-flash b{font-family:var(--display);font-weight:400;font-size:clamp(48px,14vw,110px);color:#fff;text-shadow:0 5px 0 #d8410f,0 0 40px #ff6a2b;animation:tagPop .5s cubic-bezier(.2,1.6,.4,1) both;transform:rotate(-6deg)}
@keyframes flashOut{0%{opacity:0}12%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes tagPop{from{transform:scale(.3) rotate(-20deg)}to{transform:scale(1) rotate(-6deg)}}
/* lobby computer */
.lobby{margin:8px 10px 10px;padding:9px;border-radius:12px;background:repeating-linear-gradient(90deg,transparent 0 9px,#00000010 9px 10px),linear-gradient(180deg,var(--wood-light),var(--wood));border:2px solid var(--wood-dark);box-shadow:0 3px 0 var(--wood-dark)}
.lobby-screen{background:#0b2410;border-radius:8px;padding:9px 10px;color:#7dff8a;font-family:var(--mono);font-size:12px;letter-spacing:.04em;position:relative;overflow:hidden;
  box-shadow:inset 0 0 18px #000c;background-image:repeating-linear-gradient(0deg,#ffffff07 0 1px,transparent 1px 3px)}
.lobby-screen .ls-row{display:flex;justify-content:space-between;gap:8px;text-shadow:0 0 6px #7dff8a99}
.lobby-screen .ls-row b{color:#d6ffd9;font-weight:500}
.lobby-screen .ls-title{color:#d6ffd9;font-size:11px;opacity:.85;margin-bottom:4px}
.lobby form{display:flex;gap:6px;margin-top:8px}
.lobby input{flex:1;min-width:0;background:#06160a;border:1px solid #2c6e35;border-radius:6px;padding:6px 8px;color:#7dff8a;font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.lobby input::placeholder{color:#3f8f4a}
.lobby input:focus-visible{outline:2px solid #7dff8a;outline-offset:1px}
.lobby button{background:#7dff8a;color:#0b2410;font-family:var(--mono);font-weight:500;font-size:12px;padding:6px 10px;border-radius:6px}
.lobby .ls-err{color:#ff9a7a;min-height:0;font-size:11px;margin-top:4px}
.chan .leave{margin-left:auto;opacity:.6;font-size:12px;padding:0 4px}
.chan .leave:hover{opacity:1;color:var(--danger)}
/* RGB fur picker */
.rgb{display:flex;flex-direction:column;gap:8px;background:var(--canopy);border:2px solid var(--vine);border-radius:10px;padding:10px 12px}
.rgb-row{display:grid;grid-template-columns:44px minmax(0,1fr) 18px;gap:10px;align-items:center;font-weight:700;font-size:12px;letter-spacing:.06em}
.rgb-row output{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.rgb input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:7px;border:2px solid var(--vine);background:var(--track)}
.rgb input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--fog);box-shadow:0 2px 0 #0003}
.rgb input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--fog)}

/* DMs */
.dm-find{width:calc(100% - 4px);margin:2px 2px 6px;background:var(--canopy);border:2px solid var(--vine);border-radius:8px;padding:8px 10px}
.dm-find:focus-visible{outline:none;border-color:var(--lava)}
.chan.dm{padding:6px 8px}
.chan.dm .name{display:flex;flex-direction:column;min-width:0}
.chan.dm .name b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan.dm .name small{font-weight:400;font-size:12px;color:var(--fog-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-note{font-size:11px;color:var(--fog-faint);line-height:1.4;padding:10px 8px 0;margin:0}
.dm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:4px 0 16px}
.dm-pick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:14px;background:var(--leaf);border:2px solid var(--vine)}
.dm-pick:hover{border-color:var(--lava)}
.dm-pick b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-pick small{color:var(--fog-dim)}
/* voice */
.mic-ic{position:absolute;right:10px;top:10px;font-size:14px}
.live-tag{background:#e5484d;color:#fff;font-size:10px;font-weight:800;border-radius:4px;padding:1px 4px;vertical-align:1px}
.screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.screen-tile{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;border:2px solid var(--vine)}
.screen-tile video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.screen-label{position:absolute;left:10px;bottom:10px;background:#000a;color:#fff;font-size:13px;font-weight:700;padding:3px 8px;border-radius:8px}
.screen-full{position:absolute;right:8px;top:8px;background:#000a!important;color:#fff!important}
.cam-slot{width:96px;height:96px;border-radius:50%;overflow:hidden;background:#000;flex:none}
.cam-slot video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
.tile .vol{width:80%;accent-color:var(--online);margin-top:2px}
.vcbar .icon-btn{width:30px;height:30px;font-size:15px}
.vcbar .vc-live b{font-size:12px;white-space:nowrap}
.mic-pick{max-width:220px;background:var(--canopy);border:2px solid var(--vine);border-radius:8px;padding:7px 9px;font:inherit;color:var(--fog)}
.vc-count{margin-left:auto;font-size:11px;font-weight:700;background:var(--online);color:#fff;border-radius:9px;padding:0 6px;line-height:18px}
.vc-users span.talking .av{box-shadow:0 0 0 2px var(--online);border-radius:50%}
.vcbar{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 12px;border-top:1px solid var(--vine);background:var(--leaf)}
.vc-live{flex:1;min-width:0}
.vc-live b{display:block;color:var(--online);font-size:13px}
.vc-live small{display:block;color:var(--fog-dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc-leave:hover{background:#e5484d22!important}
.stage{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stage-head .sign{font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px 14px;border-radius:16px;background:linear-gradient(180deg,var(--leaf),var(--canopy));border:3px solid transparent;cursor:pointer;min-width:0}
.tile b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.talking{border-color:var(--online);box-shadow:0 0 0 4px #2fb34433,0 0 18px #2fb34455}
.tile.talking .av{animation:talkBob .35s ease-in-out infinite alternate}
@keyframes talkBob{to{transform:translateY(-3px) scale(1.03)}}
.bubble{position:absolute;left:8px;right:8px;top:-8px;transform:translateY(-100%);background:var(--bark);border:2px solid var(--vine);border-radius:12px;padding:6px 10px;font-size:13px;text-align:center;overflow-wrap:anywhere;box-shadow:0 4px 12px #0002}
.tiles{padding-top:44px}
.stage-controls{display:flex;flex-direction:column;gap:12px;margin-top:auto;background:var(--bark);border:2px solid var(--vine);border-radius:14px;padding:12px}
.say{display:flex;gap:6px}
.say input{flex:1;min-width:0;background:var(--canopy);border:2px solid var(--vine);border-radius:8px;padding:9px 10px}
.soundboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.soundboard button{padding:10px 6px;border-radius:10px;font-weight:600;background:repeating-linear-gradient(0deg,transparent 0 6px,#00000010 6px 7px),linear-gradient(180deg,var(--wood-light),var(--wood));color:var(--wood-ink);text-shadow:0 1px 0 var(--wood-dark);border:2px solid var(--wood-dark);box-shadow:0 3px 0 var(--wood-dark)}
.soundboard button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-dark)}
/* server settings */
.ss-list{display:flex;flex-direction:column;gap:6px}
.ss-chan{display:flex;align-items:center;gap:8px}
.ss-chan b{flex:none;min-width:0;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss-chan input,.ss-chan select{flex:1;min-width:0;background:var(--canopy);border:2px solid var(--vine);border-radius:8px;padding:7px 9px;font:inherit;color:var(--fog)}
.ss-chan.add{margin-top:4px}

/* docs, settings, safety */
.link-btn{color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:2px;padding:0}
.auth-links{text-align:center;font-size:13px;color:var(--fog-dim)}
.fanmade{text-align:center;font-size:11px;color:var(--fog-faint);margin:0}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;cursor:pointer}
.agree input{width:20px;height:20px;accent-color:var(--lava);flex:none;margin-top:1px}
.doc{display:flex;flex-direction:column;gap:10px;line-height:1.5;max-width:68ch}
.doc h3{margin:8px 0 0;font-family:var(--display);font-weight:400;font-size:18px}
.doc ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.doc p{margin:0}
.doc-lead{color:var(--fog-dim)}
.rules{margin:0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:8px}
.rules li{counter-increment:r;display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:10px;background:var(--leaf);border:2px solid var(--vine);border-radius:12px;padding:10px 12px}
.rules li::before{content:counter(r);grid-row:span 2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);color:var(--wood-ink);background:linear-gradient(180deg,var(--wood-light),var(--wood));border:2px solid var(--wood-dark)}
.rules li b{font-weight:600}
.rules li span{color:var(--fog-dim)}
.rules-foot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 0}
.agreed{font-weight:600;color:var(--online)}
.blocked-msg{color:var(--fog-faint);font-style:italic;font-size:14px}
.muted-ic{margin-left:auto;font-size:11px;opacity:.7}
.settings{position:relative;width:min(980px,100%);height:min(720px,100%);display:grid;grid-template-columns:220px minmax(0,1fr);background:var(--bark);border:2px solid var(--vine);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px #0004}
.set-nav{background:var(--leaf);padding:20px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.set-nav-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fog-faint);padding:0 10px 8px}
.set-nav button{text-align:left;padding:8px 10px;border-radius:8px;font-weight:500;color:var(--fog-dim)}
.set-nav button:hover{background:var(--hover);color:var(--fog)}
.set-nav button[aria-current="page"]{background:var(--vine);color:var(--fog);font-weight:600}
.set-nav .set-out{margin-top:auto;color:var(--danger)}
.set-body{padding:24px 28px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.set-body>*{flex-shrink:0}
.set-body h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px}
.set-h{margin:6px 0 0;font-family:var(--display);font-weight:400;font-size:18px}
.set-close{position:absolute;right:12px;top:12px;background:var(--leaf)}
.set-group{display:flex;flex-direction:column;background:var(--canopy);border:2px solid var(--vine);border-radius:14px;overflow:hidden}
.set-row,.set-toggle,.set-slider{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-top:1px solid var(--vine)}
.set-group>:first-child{border-top:0}
.set-row span,.set-toggle span{min-width:0}
.set-row b,.set-toggle b,.set-slider b{display:block;font-weight:600}
.set-row small,.set-toggle small{display:block;color:var(--fog-dim);font-size:13px}
.set-row.danger b{color:var(--danger)}
.set-slider{flex-direction:column;align-items:stretch;gap:6px}
.set-slider input{accent-color:var(--lava)}
.set-slider small{color:var(--fog-dim)}
.set-toggle{cursor:pointer}
.set-toggle input{position:absolute;opacity:0;pointer-events:none}
.set-toggle i{flex:none;width:44px;height:26px;border-radius:13px;background:var(--vine-hi);position:relative;transition:background .15s}
.set-toggle i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px #0003}
.set-toggle input:checked+i{background:var(--online)}
.set-toggle input:checked+i::after{transform:translateX(18px)}
.set-toggle input:focus-visible+i{outline:2px solid var(--banana);outline-offset:2px}
.seg{display:flex;background:var(--leaf);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:6px 12px;border-radius:8px;font-weight:600;color:var(--fog-dim)}
.seg button[aria-pressed="true"]{background:var(--bark);color:var(--fog);box-shadow:0 1px 3px #0002}
.acct{border-radius:14px;overflow:hidden;background:var(--canopy);border:2px solid var(--vine)}
.acct-banner{height:90px}
.acct-row{display:flex;align-items:flex-end;gap:14px;padding:0 16px 16px;flex-wrap:wrap}
.acct-row .av.xl{margin-top:-48px;width:100px;height:100px;border-radius:50%;background:var(--canopy);padding:5px}
.acct-row>div:nth-child(2){flex:1;min-width:140px}
.switcher{width:min(560px,100%);gap:10px}
.switcher input{background:var(--canopy);border:2px solid var(--vine);border-radius:10px;padding:12px 14px;font-size:17px}
.switcher input:focus-visible{outline:none;border-color:var(--lava)}
.qs-list{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow-y:auto}
.qs-list button{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;padding:8px 10px;border-radius:8px}
.qs-list button[aria-selected="true"],.qs-list button:hover{background:var(--leaf)}
.qs-list b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qs-list small{color:var(--fog-faint)}
body.compact .msg{padding-top:1px;padding-bottom:1px;grid-template-columns:28px minmax(0,1fr)}
body.compact .msg .av{width:24px;height:24px}
body.compact .msg .text{line-height:1.3}
body.compact .day{margin:8px 0 2px}
@media (max-width:720px){
  .settings{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);height:100%;border-radius:14px}
  .set-nav{flex-direction:row;overflow-x:auto;padding:10px;padding-right:56px;gap:4px}
  .set-nav-h{display:none}
  .set-nav button{white-space:nowrap}
  .set-nav .set-out{margin-top:0}
  .set-body{padding:18px 16px}
}

/* owner + 2FA */
.owner-tag{font-family:var(--display);font-weight:400;font-size:11px;letter-spacing:.05em;padding:1px 7px;border-radius:6px;color:#4a2b00;background:linear-gradient(180deg,#ffe27a,#ffbf2b);border:1px solid #c98a00;white-space:nowrap}
.crown{margin-left:4px;font-size:12px}
.code-input{font-family:var(--mono);font-size:24px;letter-spacing:.3em;text-align:center;background:var(--canopy);border:2px solid var(--vine);border-radius:10px;padding:10px}
.code-input:focus-visible{outline:none;border-color:var(--lava)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.45}
.qr-box{display:flex;justify-content:center}
#qrHost{background:#fff;padding:10px;border-radius:12px;border:2px solid var(--vine);min-height:40px}
#qrHost img,#qrHost canvas{display:block}
.secret-key{display:flex;gap:8px;align-items:center}
.secret-key code{flex:1;min-width:0;font-family:var(--mono);background:var(--canopy);border:2px solid var(--vine);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.backup-codes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.backup-codes code{font-family:var(--mono);font-size:15px;text-align:center;background:var(--canopy);border:2px dashed var(--vine);border-radius:8px;padding:8px}

/* accounts */
.join-steps{display:flex;flex-direction:column;gap:10px;line-height:1.5}
.join-steps p{margin:0}
.auth-head{text-align:center}
.auth-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px}
.auth-head p{margin:4px 0 0;color:var(--fog-dim)}
.auth-form{display:flex;flex-direction:column;gap:14px}
.auth-form input[type=email],.auth-form input[type=password],.auth-form input[type=text]{font-size:16px}
.req{color:var(--danger)}
.hint-inline{font-size:10px;text-transform:none;letter-spacing:0;color:var(--fog-faint);font-weight:400}
.pw-wrap{position:relative;display:flex}
.pw-wrap input{flex:1;min-width:0;padding-right:44px!important}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:32px;border-radius:6px;font-size:15px}
.pw-eye:hover{background:var(--leaf)}
.pw-str{font-size:12px;font-weight:600;margin-top:-8px;min-height:0}
.pw-str.weak{color:var(--danger)}.pw-str.ok{color:var(--idle)}.pw-str.strong{color:var(--online)}
.field input[type=email],.field input[type=password],.field input[type=text]{background:var(--canopy);border:2px solid var(--vine);border-radius:8px;padding:10px 12px}

/* discord-style bits */
.popout{position:fixed;z-index:46;width:300px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow-y:auto;background:var(--bark);border:2px solid var(--vine);border-radius:14px;box-shadow:0 12px 36px #0005}
.po-banner{height:64px}
.po-av{padding:0 14px;margin-top:-34px}
.po-av .av{display:block;border-radius:50%;background:var(--bark);padding:4px;width:80px;height:80px;box-sizing:border-box}
.po-av .av .dot{width:16px;height:16px;border-width:4px;right:2px;bottom:2px}
.po-body{padding:6px 14px 14px;display:flex;flex-direction:column;gap:10px}
.po-name{font-family:var(--display);font-size:22px;line-height:1.1}
.po-user{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--fog-dim);font-size:13px;margin-top:-6px}
.po-status{font-size:13px}
.po-sec h4{margin:0 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--fog-faint);font-weight:700}
.po-sec p{margin:0;font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.po-sec{background:var(--canopy);border-radius:10px;padding:8px 10px}
.po-dm input{width:100%;background:var(--canopy);border:2px solid var(--vine);border-radius:8px;padding:9px 10px}
.po-dm input:focus-visible{outline:none;border-color:var(--lava)}
.po-actions{display:flex;gap:6px;flex-wrap:wrap}
.po-actions .btn{flex:1}
.ctx-menu{position:fixed;z-index:47;min-width:210px;background:var(--bark);border:1px solid var(--vine);border-radius:10px;padding:6px;box-shadow:0 10px 30px #0005;display:flex;flex-direction:column;gap:1px}
.ctx-menu>button{text-align:left;padding:7px 10px;border-radius:6px;font-weight:500;font-size:14px}
.ctx-menu>button:hover{background:var(--lava);color:#fff}
.ctx-menu>button.danger{color:var(--danger)}
.ctx-menu>button.danger:hover{background:var(--danger);color:#fff}
.ctx-menu hr{border:0;border-top:1px solid var(--vine);margin:4px 2px}
.ctx-react{display:flex;gap:2px;padding:2px 2px 6px;border-bottom:1px solid var(--vine);margin-bottom:4px}
.ctx-react button{flex:1;height:34px;border-radius:8px;font-size:17px;background:var(--canopy)}
.ctx-react button:hover{background:var(--leaf)}
.srv-name{padding:0;text-align:left;max-width:100%}
.srv-name .chev{font-size:14px;margin-left:2px}
.cmds-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--fog-faint);padding:4px 8px 6px;display:flex;justify-content:space-between;gap:8px}
.cmds-h small{text-transform:none;letter-spacing:0;font-weight:500}
.cmds button{align-items:center}
.cmds button[aria-selected="true"]{background:var(--leaf)}
.owner-sign{background:repeating-linear-gradient(0deg,transparent 0 7px,#00000012 7px 8px),linear-gradient(180deg,#ffe27a,#e0a21c)!important;color:#4a2b00!important;text-shadow:none!important;border-color:#a06c00!important}
.typing{display:flex;align-items:center;gap:6px}
.typing b{font-weight:700;color:var(--fog)}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--fog-dim);animation:dot 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}

function ook(){
  if(local.mute || S.status==="dnd" || !actx) return;
  try{
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
    o.type="triangle"; o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(260,t+.18);
    g.gain.setValueAtTime(.001,t); g.gain.exponentialRampToValueAtTime(.25,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.25);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.26);
  }catch(e){}
}

/* ================= storage adapters ================= */
function liveApi(){
  const db=S.db, col=k=>db.collection(pathFor(k));
  return {
    watchChannel(k, cb, n){ return col(k).orderBy("ts","desc").limit(n).onSnapshot(s=>cb(s.docs.map(d=>Object.assign({id:d.id,pending:d.metadata.hasPendingWrites},d.data())).reverse()), ()=>cb(null)); },
    send(k,m){ return col(k).doc().set(m); },
    update(k,id,p){ return db.doc(pathFor(k)+"/"+id).update(p); },
    remove(k,id){ return db.doc(pathFor(k)+"/"+id).delete(); },
    watchDMIndex(cb){ return db.doc("dmidx/"+S.uid).onSnapshot(d=>cb(d.exists?(d.data().peers||{}):{}), ()=>cb({})); },
    async touchDM(peer){
      const ts=Date.now();
      for(const [a,b] of [[S.uid,peer],[peer,S.uid]]){
        const ref=db.doc("dmidx/"+a);
        try{ await ref.update({peers:{[b]:ts}}); }catch(e){ try{ await ref.set({peers:{[b]:ts}}); }catch(e2){} }
      }
    },
    setProfile(p){ return db.doc("profiles/"+S.uid).set(p); },
    updateProfile(p){ return db.doc("profiles/"+S.uid).update(p); },
    watchServers(cb){ return db.collection("servers").onSnapshot(s=>cb(s.docs.map(d=>Object.assign({docId:d.id},d.data()))), ()=>{}); },
    createServer(d){ return db.collection("servers").doc().set(d); },
    updateServer(id,p){ return db.doc("servers/"+id).update(p); },
    deleteServer(id){ return db.doc("servers/"+id).delete(); }
  };
}

    watchServers(cb){ srvL=cb; setTimeout(emitSrv,0); return ()=>{}; },
    async createServer(d){ local.servers.push(Object.assign({docId:"d"+Date.now()},d)); emitSrv(); },
    async updateServer(id,p){ const s=local.servers.find(x=>x.docId===id); if(s) Object.assign(s,p); emitSrv(); },
    async deleteServer(id){ local.servers=local.servers.filter(x=>x.docId!==id); emitSrv(); },
    watchDMIndex(cb){ local.dmidx=local.dmidx||{}; S._dmidxCb=cb; setTimeout(()=>cb(Object.assign({},local.dmidx)),0); return ()=>{}; },
    async touchDM(peer){ local.dmidx=local.dmidx||{}; local.dmidx[peer]=Date.now(); saveLocal(); S._dmidxCb && S._dmidxCb(Object.assign({},local.dmidx)); },

let api;
/* generic document store used by newer features (works live and in demo) */
const deepMerge=(a,b)=>{ const out=Array.isArray(a)?a.slice():Object.assign({},a||{}); for(const [k,v] of Object.entries(b||{})){ if(v&&typeof v==="object"&&!Array.isArray(v)&&out[k]&&typeof out[k]==="object"&&!Array.isArray(out[k])) out[k]=deepMerge(out[k],v); else out[k]=v; } return out; };
let store;
function makeStore(){
  if(S.mode==="live"){
    const db=S.db;
    return {
      watchDoc:(path,cb)=>db.doc(path).onSnapshot(d=>cb(d.exists?d.data():null),()=>cb(null)),
      watchCol:(path,cb,where)=>{ let q=db.collection(path); if(where) q=q.where(...where); return q.onSnapshot(sn=>{ const o={}; sn.docs.forEach(d=>o[d.id]=d.data()); cb(o); },()=>cb({})); },
      set:(path,d)=>db.doc(path).set(d),
      update:(path,d)=>db.doc(path).update(d),
      del:path=>db.doc(path).delete(),
      async add(col,d){ const r=db.collection(col).doc(); await r.set(d); return r.id; },
      async get(path){ const d=await db.doc(path).get(); return d.exists?d.data():null; }
    };
  }
  local.kv=local.kv||{};
  const KV=local.kv, L=[];
  const fire=()=>{ saveLocal(); L.slice().forEach(l=>{ try{ l.run(); }catch(e){ console.error(e); } }); };
  const colOf=(path,where)=>{ const o={}; Object.keys(KV).forEach(k=>{ if(k.startsWith(path+"/") && !k.slice(path.length+1).includes("/")){ const d=KV[k]; if(!where || (where[1]==="array-contains" && Array.isArray(d[where[0]]) && d[where[0]].includes(where[2]))) o[k.split("/").pop()]=JSON.parse(JSON.stringify(d)); } }); return o; };
  return {
    watchDoc(path,cb){ const l={run:()=>cb(KV[path]?JSON.parse(JSON.stringify(KV[path])):null)}; L.push(l); setTimeout(l.run,0); return ()=>{ const i=L.indexOf(l); if(i>-1) L.splice(i,1); }; },
    watchCol(path,cb,where){ const l={run:()=>cb(colOf(path,where))}; L.push(l); setTimeout(l.run,0); return ()=>{ const i=L.indexOf(l); if(i>-1) L.splice(i,1); }; },
    async set(path,d){ KV[path]=JSON.parse(JSON.stringify(d)); fire(); },
    async update(path,d){ if(!KV[path]) throw {code:"invalid_argument"}; KV[path]=deepMerge(KV[path],JSON.parse(JSON.stringify(d))); fire(); },
    async del(path){ delete KV[path]; fire(); },
    async add(col,d){ const id="k"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); KV[col+"/"+id]=JSON.parse(JSON.stringify(d)); fire(); return id; },
    async get(path){ return KV[path]?JSON.parse(JSON.stringify(KV[path])):null; }
  };
}

    if(window.claude && claude.use && !window.YAPPS_READY){ S.practiceWhy = db ? "outside" : "signedout"; S.profilesReady=true; S.credReady=true; renderJoinGate(); return; }

  }

async function saveProfile(d, errEl, btn){
  const name=(d.name||"").trim();
  errEl.textContent="";
  if(!/^[A-Za-z0-9_]{3,16}$/.test(name)){ errEl.textContent="Usernames need 3 to 16 letters, numbers or underscores."; return false; }
  if(hasBad(name) || hasBad(name.replace(/_/g,""))){ errEl.textContent="That name has a word we don't allow. Pick a different one."; return false; }
  if(hasBad(d.status) || hasBad(d.bio)){ errEl.textContent="Your status or About me has a word we don't allow."; return false; }
  if(Object.entries(S.profiles).some(([id,p])=>id!==S.uid && (p.name||"").toLowerCase()===name.toLowerCase())){ errEl.textContent="Another gorilla already has that name. Try a different one."; return false; }
  const old=myProfile()||{};
  const display=(d.display||"").trim().replace(/\s+/g," ").slice(0,32);
  if(hasBad(display)){ errEl.textContent="Your display name has a word we don't allow."; return false; }
  const p=Object.assign({}, old, {name, nameLower:name.toLowerCase(), display, fur:d.fur, hat:d.hat, face:d.face||"normal", pattern:(d.pattern&&owns(old,d.pattern))?d.pattern:"", nameColor:(d.nameColor&&owns(old,d.nameColor))?d.nameColor:"",
    acc:(d.acc&&owns(old,d.acc))?d.acc:"", effect:(d.effect&&owns(old,d.effect))?d.effect:"",
    status:(d.status||"").trim().slice(0,40), bio:(d.bio||"").trim().slice(0,160), joined:old.joined||Date.now(), bananas:old.bananas||0});
  if(d.rulesOk) p.rulesOk=d.rulesOk;
  btn.disabled=true;
  try{ await api.setProfile(p); S.profiles[S.uid]=p; return true; }
  catch(e){
    errEl.textContent = e && e.code==="invalid_argument"
      ? "You can't make an account yet. Ask the owner to invite you: they tap Share and add your email."
      : "Couldn't save your gorilla. Check your connection and try again.";
    return false;
  } finally { btn.disabled=false; }
}

function setupRoom(){
  const r=S.room;
  r.onPeers(ch=>{ S.peers=ch.peers; if(S.loggedIn){ renderTroop(); renderChans(); connectVoicePeers(); if(S.view==="vc") renderStage(); } }, ()=>{});
  r.on("typing", m=>{
    if(m.sameTab || !m.by || !m.data || m.data.k!==key() || S.blocks.has(m.by)) return;
    S.typing[m.by]=Date.now()+3500; renderTyping();
  }, ()=>{});
  r.on("vc", m=>{
    if(m.sameTab || !m.by || !m.data || !S.vc || m.data.vc!==S.vc || S.blocks.has(m.by)) return;
    if(m.data.t==="say" && typeof m.data.text==="string") hearSay(m.by, m.data.text.slice(0,140), +m.data.pitch);
    if(m.data.t==="sfx" && SFX.some(x=>x[0]===m.data.s)) hearSfx(m.by, m.data.s);
    if(m.data.t==="csfx" && typeof m.data.name==="string") hearCustomSfx(m.by, m.data.name);
  }, ()=>{});
  r.on("beat", m=>{
    if(m.sameTab || !m.data || m.data.k!==key()) return;
    shake();
  }, ()=>{});
}

/* ---- live microphone voice: every browser in a room connects to every other one (best for 2-6 people) ---- */
const V = { peer:null, pid:null, mic:null, micOn:true, calls:{}, meters:{}, meterT:0, starting:false,
  out:{screen:null, cam:null}, vout:{}, vin:{}, vels:{}, vol:(local.vcVol||{}) };
const CAN_SCREEN = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
function voiceNote(){
  if(!S.fb) return "Demo mode: live mic voice works on the real site. Typed voice and sounds work here.";
  if(!V.mic) return "🎙️ Mic is off or blocked. Allow the microphone in your browser to talk, or type to talk below.";
  return V.micOn ? "🎙️ Your mic is live. Everyone in this room can hear you." : "🔇 You're muted. Tap the mic button to talk.";

function silentStream(){ try{ const ctx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx=actx||ctx; return ctx.createMediaStreamDestination().stream; }catch(e){ return new MediaStream(); } }
async function startVoice(){
  if(V.starting) return;
  if(!window.Peer){ toast("Voice is still loading. Try again in a second."); return; }
  V.starting=true;
  try{
    if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    const ac={echoCancellation:true,noiseSuppression:!local.noNS,autoGainControl:true}; if(local.micId) ac.deviceId={ideal:local.micId};
    try{ V.mic=await navigator.mediaDevices.getUserMedia({audio:ac}); V.micOn=true; watchLevel(S.uid,V.mic); }
    catch(e){ V.mic=null; toast("Mic blocked. You can still listen and type to talk."); }
    if(V.mic && isTimedOut()){ V.micOn=false; V.mic.getAudioTracks().forEach(t=>t.enabled=false); }
    const vid=S.vc;
    let ice=null; try{ if(window.YAPPS && YAPPS.turn) ice=await YAPPS.turn(); }catch(e){}
    V.peer=new Peer(undefined,{config:{iceServers:ice||[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]}});
    V.peer.on("open",id=>{ if(S.vc!==vid){ V.peer && V.peer.destroy(); return; } V.pid=id; syncPresence(); connectVoicePeers(); renderStage(); renderVcBar(); });
    V.peer.on("call",call=>{
      if(!S.vc){ call.close(); return; }
      const from=call.metadata && call.metadata.uid;

  for(const [k,m] of Object.entries(S.latest)){
    if(!S.loggedIn || !m || (prev[k] && prev[k].ts===m.ts) || m.ts<=S.bootTs || m.uid===S.uid || k===key() || S.blocks.has(m.uid)) continue;
    const ci=chanInfo(k); if(!ci.mine) continue;
    if((local.muted||{})[k]) continue;
    const who=dn(m.uid), snip=censor(m.text||(m.sticker?"[sticker]":m.img?"[image]":m.poll?"📊 poll":"sent you a message")).slice(0,50);

function setLastFor(k, m){

function OLD_syncWatchers(){
  const want=new Set();
  allMaps().forEach(m=>m.chans.forEach(c=>{ if(!c.rules && !(local.muted||{})[m.id+"."+c.id]) want.add(m.id+"."+c.id); }));
  Object.keys(S.dmPeers).slice(0,20).forEach(p=>want.add(dmKey(p)));
  Object.keys(S.watchers).forEach(k=>{ if(!want.has(k)){ S.watchers[k](); delete S.watchers[k]; } });
  let n=Object.keys(S.watchers).length;
  want.forEach(k=>{

    S.watchers[k]=api.watchChannel(k, list=>{
      if(!list) return;

      if(m && local.seen[k]===undefined){ local.seen[k]=m.ts; saveLocal(); }
      if(m && k.startsWith("dm~") && k!==key() && m.uid!==S.uid && m.ts>S.bootTs && S.pinged[k]!==m.id && !S.blocks.has(m.uid)){
        S.pinged[k]=m.id; if(!local.dmMute) ook(); toast("💬 New DM from "+prof(m.uid).name+": "+censor(m.text||"[sticker]").slice(0,40));
      } else if(m && !k.startsWith("dm~") && k!==key() && m.uid!==S.uid && m.ts>S.bootTs && mentionsMe(m.text,m.uid) && S.pinged[k]!==m.id){

        toast(`${prof(m.uid).name} mentioned you in #${cid}${mp?" · "+mp.name:""}`);

function unreadState(k){
  const m=S.latest[k]; if(!m || m.uid===S.uid || (local.muted||{})[k] || S.blocks.has(m.uid)) return null;
  if(k===key()) return null;
  const seen=local.seen[k];
  if(seen===undefined && m.ts<=S.bootTs) return null;
  if(seen!==undefined && m.ts<=seen) return null;
  return mentionsMe(m.text,m.uid) ? "mention" : "unread";
}

function applyCommand(text){
  const [cmd,...rest]=text.split(" "); const arg=rest.join(" ");
  switch(cmd.toLowerCase()){
    case "/shrug": return (arg?arg+" ":"")+"¯\\_(ツ)_/¯";
    case "/roll": return "🎲 rolled a **"+(1+Math.floor(Math.random()*6))+"**";
    case "/flip": return "🍌 flipped a banana coin: **"+(Math.random()<.5?"PEEL":"STEM")+"**";
    case "/ooga": return "OOGA BOOGA 🦍🦍🦍";
    case "/beat": if(S.room) S.room.emit("beat",{k:key()}).catch(()=>{}); shake(); return "*beats chest* 🦍💥";
    case "/tag": {
      const on=[...onlineUids()].filter(u=>u!==S.uid);
      if(!on.length) return "👉 tried to tag someone but nobody else is online";
      return "👉 @"+prof(on[Math.floor(Math.random()*on.length)]).name+" TAG, YOU'RE IT!";
    }
  }
  return text;
}

async function send(payload){
  if(S.readonly) return;
  const why=postBlockReason(); if(why){ toast(why); return; }
  const wait=slowWait(key()); if(wait>0){ toast(`⏱ Slow mode is on. Wait ${Math.ceil(wait/1000)}s before your next message.`); return; }
  const m=Object.assign({uid:S.uid, ts:Date.now(), reacts:{}}, payload);
  if(S.replyTo){ m.reply={id:S.replyTo.id, uid:S.replyTo.uid, text:String(S.replyTo.text||"").slice(0,90)}; S.replyTo=null; renderComposeBits(); }
  if(S.mapId==="home" && !S.chan) return;
  if(isRulesChan() && S.mapId!=="home") return;
  if(S.mapId==="home" && (S.blocks.has(S.chan) || prof(S.chan).dmOff)) return;
  const k0=key();
  try{ await api.send(k0, m); setLastFor(k0, m); notifyInboxes(k0, m); S.lastSent[k0]=m.ts; earnBanana(); if(isDMChan()) api.touchDM(S.chan); if(S.mode==="demo") botReply(); }
  catch(e){
    if(e && e.code==="invalid_argument"){ S.readonly=true; renderCompose(); toast("You can read this server but can't post yet."); }
    else if(e && e.code==="quota_exceeded") toast("This server is full of messages. Ask the owner to clear some old ones.");
    else toast("Message didn't send. Try again.");
  }
}
function sendText(raw){

}

async function uploadImage(file){
  if(!S.assets) return;
  if(!/^image\/(png|jpeg|gif|webp)$/.test(file.type)){ toast("Pick a PNG, JPG, GIF or WebP image."); return; }
  if(file.size>15*1024*1024){ toast("That image is over 15 MB. Try a smaller one."); return; }
  if(!picCheckerReady()){ toast("Pictures can't be sent here because the safety checker isn't available."); return; }
  toast("🛡 Checking your picture…");
  { const frames=[];
    try{
      const dec=await decodeFrames(file); frames.push(...dec.frames);
      const checks=[]; for(const f of frames.slice(0,4)) checks.push(await cropTo(f,512,512,"image/jpeg",.85));
      const v=await checkPicture(checks,"chat");
      if(!v.ok){ toast("🚫 Not sent: "+v.reason); return; }
    }catch(e){ toast(e && e.message && !/^encode$/.test(e.message) ? e.message : "Couldn't check that picture. Try another one."); return; }
    finally{ frames.forEach(f=>{ try{ f.close(); }catch(e){} }); }
  }
  toast("Uploading image…");
  try{
    const r=await S.assets.upload(file);
    const caption=$("msgInput") ? $("msgInput").value.trim() : "";
    if($("msgInput")) $("msgInput").value="";
    await send({text:caption.slice(0,600), img:r.id});

  }catch(e){
    toast(e && e.code==="too_large" ? "That image is too big." : e && e.code==="quota_or_state" ? "Image storage is full." : "Upload failed. Try again.");
  }
}

function fmtDay(ts){

function fmtText(t){
  let s=esc(censor(t));
  const ce=S.mapId!=="home"?mapEmojis():[];
  if(ce.length){ const by={}; ce.forEach(e=>by[e.name]=e.data); s=s.replace(/:([a-z0-9_]{2,24}):/g,(m0,n)=>by[n]?`<img class="cemoji${/^\s*:[a-z0-9_]{2,24}:\s*$/.test(t)?" big":""}" src="${by[n]}" alt=":${n}:" title=":${n}:">`:m0); }
  const blocks=[]; s=s.replace(/```(?:[a-z0-9+#-]{1,12}\n)?([\s\S]*?)```/gi,(m,c)=>{ blocks.push(c.replace(/^\n+|\n+$/g,"")); return "\u0001"+(blocks.length-1)+"\u0001"; });
  const codes=[]; s=s.replace(/`([^`\n]+)`/g,(m,c)=>{ codes.push(c); return "\u0000"+(codes.length-1)+"\u0000"; });
  s=s.replace(/\|\|([^|\n]+)\|\|/g,'<span class="spoiler" tabindex="0" role="button" aria-label="Spoiler, tap to show">$1</span>')
     .replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<i>$2</i>")
     .replace(/__([^_\n]+)__/g,"<u>$1</u>").replace(/~~([^~\n]+)~~/g,"<s>$1</s>")
     .replace(/(https?:\/\/[^\s<]+[^\s<.,!?)])/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
     .replace(/(^|[\s(])@([A-Za-z0-9_]{3,16})/g,'$1<span class="at">@$2</span>');
  // line-level formatting: quotes, headings, small text and bullet lists
  const out=[]; let buf=[];
  const flush=()=>{ if(buf.length){ out.push(buf.join("\n")); buf=[]; } };
  for(const line of s.split("\n")){
    let m;
    if((m=/^&gt; ?(.*)$/.exec(line))){ flush(); out.push(`<span class="md-quote">${m[1]||"&nbsp;"}</span>`); }
    else if((m=/^(#{1,3}) (.+)$/.exec(line))){ flush(); out.push(`<span class="md-h md-h${m[1].length}">${m[2]}</span>`); }
    else if((m=/^-# (.+)$/.exec(line))){ flush(); out.push(`<span class="md-sub">${m[1]}</span>`); }
    else if((m=/^[-*] (.+)$/.exec(line))){ flush(); out.push(`<span class="md-li">${m[1]}</span>`); }
    else buf.push(line);
  }
  flush();
  s=out.join("");
  s=s.replace(/\u0001(\d+)\u0001/g,(m,i)=>`<pre class="md-code"><code>${blocks[i]}</code></pre>`);
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>`<code>${codes[i]}</code>`);
}
