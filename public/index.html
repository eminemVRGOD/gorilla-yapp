/* ================= badges ================= */
function badgesOf(uid){
  const p=S.profiles[uid]||{}, out=[];
  if(uid===S.ownerUid) out.push(["👑","Owner","Runs Gorilla Yapps"]);
  if(rolesOf(uid).some(r=>r.perms&&(r.perms.manageMessages||r.perms.timeout))) out.push(["🛡️","Mod","Helps keep the troop safe"]);
  if((S.allServersRaw||[]).some(x=>x.owner===uid)) out.push(["🏗️","Server Builder","Made their own server"]);
  const early=Object.entries(S.profiles).filter(([,x])=>x&&x.joined).sort((a,b)=>a[1].joined-b[1].joined).slice(0,25).map(([u])=>u);
  if(early.includes(uid)) out.push(["🌱","Early Gorilla","One of the first 25 gorillas"]);
  const lv=levelOf(xpOf(p));
  if(lv>=20) out.push(["💫","Level 20","Reached level 20"]); else if(lv>=10) out.push(["🌟","Level 10","Reached level 10"]); else if(lv>=5) out.push(["⭐","Level 5","Reached level 5"]);
  if(xpOf(p)>=500) out.push(["💬","Chatterbox","Earned 500+ bananas by chatting"]);
  if((p.bananas||0)>=250) out.push(["🍌","Banana Hoarder","Has 250+ bananas saved up"]);
  if(p.daily && (p.daily.streak||0)>=7) out.push(["🔥","Streak Keeper","Grabbed daily bananas 7 days in a row"]);
  if(Array.isArray(p.owned) && p.owned.length>=6) out.push(["🛍️","Big Spender","Owns 6+ shop items"]);
  return out;
}

  const byName=(a,b)=>prof(a).name.localeCompare(prof(b).name);
  const friends=all.filter(u=>S.friends.has(u)&&u!==S.uid).sort((a,b)=>(on.has(b)-on.has(a))||byName(a,b));
  const own=S.ownerUid && S.profiles[S.ownerUid] ? S.ownerUid : null;
  const placed=new Set(own?[own]:[]);
  const roleGroups=((S.roles||{}).list||[]).map(r=>{ const mem=all.filter(u=>!placed.has(u) && rolesOf(u)[0]===r).sort((a,b)=>(on.has(b)-on.has(a))||byName(a,b)); mem.forEach(u=>placed.add(u)); return {r,mem}; }).filter(x=>x.mem.length);
  const online=all.filter(u=>on.has(u)&&!S.friends.has(u)&&!placed.has(u)).sort(byName), offline=all.filter(u=>!on.has(u)&&!S.friends.has(u)&&!placed.has(u)).sort(byName);
  const top=[...all].sort((a,b)=>xpOf(prof(b))-xpOf(prof(a))).slice(0,5).filter(u=>xpOf(prof(u))>0);
  const row=(u,isOn)=>{const p=prof(u), st=sm.get(u);return `<button class="member ${isOn?"":"off"}" data-profile="${esc(u)}" title="${isOn?ST_LABEL[st]:"Offline"}"><div class="av sm">${av(p)}${isOn?`<span class="dot ${st}"></span>`:""}</div><div class="m-info"><b><span ${nameAttr(u,false)}>${esc(p.display||p.name)}</span>${u===S.ownerUid?'<span class="crown" title="Owner">👑</span>':""}${u===S.uid?'<span class="you-tag">YOU</span>':""}${S.friends.has(u)?'<span class="fav" title="Friend">★</span>':""}${isTimedOut(u)?'<span class="to-badge" title="Timed out">⏳</span>':""}</b>${activityOf(p)?`<small class="act-line">${activityText(p)}</small>`:p.status?`<small>${esc(censor(p.status))}</small>`:""}</div></button>`;};
  $("troop").innerHTML=
    (top.length?`<div class="cat"><span class="sign">Top yappers</span></div><div class="board">${top.map((u,i)=>{const p=prof(u);return `<button class="board-row" data-profile="${esc(u)}"><span class="rank">${i===0?"👑":i+1}</span><span class="av xs" style="width:24px;height:24px">${av(p)}</span><span>${esc(p.display||p.name)}</span><span class="b">Lv ${levelOf(xpOf(p))}</span></button>`;}).join("")}</div>`:"")+
    (own?`<div class="cat"><span class="sign owner-sign">👑 Owner — 1</span></div>${row(own,on.has(own))}`:"")+
    roleGroups.map(({r,mem})=>`<div class="cat"><span class="sign role-sign" style="--rc:${esc(r.color)}">${esc(r.name)} — ${mem.length}</span></div>${mem.map(u=>row(u,on.has(u))).join("")}`).join("")+
    (friends.filter(u=>!placed.has(u)).length?`<div class="cat"><span class="sign">Friends — ${friends.filter(u=>on.has(u)).length}/${friends.length}</span></div>${friends.filter(u=>!placed.has(u)).map(u=>row(u,on.has(u))).join("")}`:"")+
    `<div class="cat"><span class="sign">Online — ${online.length}</span></div>${online.map(u=>row(u,true)).join("")}`+
    (offline.length?`<div class="cat"><span class="sign">Offline — ${offline.length}</span></div>${offline.map(u=>row(u,false)).join("")}`:"")+
    (S.mode==="live" && all.length<=1 ? `<p class="note" style="text-align:left;padding:8px">Invite your friends: tap Share at the top of the page and add their emails so they can sign up and yap here too.</p>`:"");
}

/* ================= friends ================= */
function loadFriends(){
  if(S.mode==="live"){
    try{
      S.db.doc("data/users/"+S.uid+"/friends").onSnapshot(d=>{ const x=d.exists?d.data():{}; S.friends=new Set(Array.isArray(x.ids)?x.ids:[]); S.freqOut=new Set(Array.isArray(x.out)?x.out:[]); if(S.loggedIn) renderAll(); }, ()=>{});
      store.watchDoc("freq/"+S.uid, onFreqInbox);
      S.db.doc("data/users/"+S.uid+"/blocks").onSnapshot(d=>{ const ids=(d.exists && Array.isArray(d.data().ids))?d.data().ids:[]; S.blocks=new Set(ids); if(S.loggedIn){ renderFeed(); renderChans(); } }, ()=>{});
    }catch(e){}
  } else { S.friends=new Set(local.friends||[]); S.freqOut=new Set(local.freqOut||[]); S.blocks=new Set(local.blocks||[]); store.watchDoc("freq/"+S.uid, onFreqInbox); }
}
let friendChain=Promise.resolve();
S.freqIn={}; S.freqOut=new Set();
function saveFriends(){
  const ids=[...S.friends], out=[...S.freqOut];
  if(S.mode==="live") friendChain=friendChain.then(()=>S.db.doc("data/users/"+S.uid+"/friends").set({ids,out})).catch(()=>toast("Couldn't save your friends list."));
  else { local.friends=ids; local.freqOut=out; saveLocal(); }
}
// put my answer (a time = request, "ok" = accepted, "rm" = unfriended, null = take it back) in someone's request box
async function setFreqEntry(to, val){
  const path="freq/"+to;
  const d=(await store.get(path).catch(()=>null))||{};
  const items=Object.assign({}, d.items||{});
  if(val===null) delete items[S.uid]; else items[S.uid]=val;
  await store.set(path,{items});
}
function friendState(uid){
  if(S.friends.has(uid)) return "friend";
  if(typeof S.freqIn[uid]==="number") return "incoming";
  if(S.freqOut.has(uid)) return "outgoing";
  return "none";
}
const pendingCount = () => Object.entries(S.freqIn).filter(([u,v])=>typeof v==="number" && !S.blocks.has(u) && S.profiles[u]).length;
async function sendFriendRequest(uid){
  if(uid===S.uid || S.friends.has(uid)) return;
  if(friendState(uid)==="incoming") return acceptFriend(uid);
  S.freqOut.add(uid); saveFriends(); renderAll();
  try{ await setFreqEntry(uid, Date.now()); toast("Friend request sent to "+dn(uid)+" ✉️"); }catch(e){ S.freqOut.delete(uid); saveFriends(); renderAll(); toast("Couldn't send the request. Try again."); }
}
async function acceptFriend(uid){
  S.friends.add(uid); S.freqOut.delete(uid); delete S.freqIn[uid]; saveFriends(); renderAll();
  toast("You and "+dn(uid)+" are friends now! ★");
  try{ await setFreqEntry(uid,"ok"); await store.set("freq/"+S.uid,{items:cleanInbox()}); }catch(e){}
}
async function declineFriend(uid){
  delete S.freqIn[uid]; renderAll();
  try{ await store.set("freq/"+S.uid,{items:cleanInbox()}); }catch(e){}
}
async function cancelFriendRequest(uid){
  S.freqOut.delete(uid); saveFriends(); renderAll();
  try{ await setFreqEntry(uid,null); }catch(e){}
}
async function removeFriend(uid){
  S.friends.delete(uid); saveFriends(); renderAll(); toast("Removed "+dn(uid)+" from friends");
  try{ await setFreqEntry(uid,"rm"); }catch(e){}
}
function cleanInbox(){ const o={}; Object.entries(S.freqIn).forEach(([u,v])=>{ if(typeof v==="number") o[u]=v; }); return o; }
function onFreqInbox(d){
  const items=(d && d.items && typeof d.items==="object") ? d.items : {};
  let changed=false;
  for(const [u,v] of Object.entries(items)){
    if(v==="ok"){ if(!S.friends.has(u)){ S.friends.add(u); toast(dn(u)+" accepted your friend request! ★"); } S.freqOut.delete(u); changed=true; }
    else if(v==="rm"){ if(S.friends.has(u)) S.friends.delete(u); changed=true; }
  }
  const before=JSON.stringify(cleanInbox());
  S.freqIn={}; Object.entries(items).forEach(([u,v])=>{ if(typeof v==="number" && !S.friends.has(u)) S.freqIn[u]=v; });
  if(JSON.stringify(cleanInbox())!==before && S.freqPrimed && pendingCount()) { if(!local.dmMute) ook(); }
  S.freqPrimed=true;
  if(changed){ saveFriends(); store.set("freq/"+S.uid,{items:cleanInbox()}).catch(()=>{}); }
  if(S.loggedIn) renderAll();
}
function toggleFriend(uid){
  const st=friendState(uid);
  if(st==="friend") removeFriend(uid);
  else if(st==="outgoing") cancelFriendRequest(uid);
  else sendFriendRequest(uid);
}
const friendBtnLabel = uid => ({friend:"★ Friends", incoming:"✓ Accept request", outgoing:"✉️ Request sent", none:"☆ Add friend"})[friendState(uid)];

let blockChain=Promise.resolve();
function toggleBlock(uid){
  const had=S.blocks.has(uid);
  had?S.blocks.delete(uid):S.blocks.add(uid);
  const ids=[...S.blocks];
  toast(had?"Unblocked "+prof(uid).name:"Blocked "+prof(uid).name+". Their messages are hidden.");
  if(S.mode==="live") blockChain=blockChain.then(()=>S.db.doc("data/users/"+S.uid+"/blocks").set({ids})).catch(()=>toast("Couldn't save your block list."));
  else { local.blocks=ids; saveLocal(); }
  renderAll();
}

/* ================= polls ================= */
function pollHTML(x){
  const pl=x.poll, opts=Array.isArray(pl.opts)?pl.opts.slice(0,6):[], votes=x.votes||{};
  const counts=opts.map(()=>0); let total=0;
  Object.entries(votes).forEach(([u,v])=>{ if(typeof v==="number" && v>=0 && v<opts.length && !S.blocks.has(u)){ counts[v]++; total++; } });
  const mine=votes[S.uid], closed=!!pl.closed, canEnd=!closed && (x.uid===S.uid || can("manageMessages"));
  const top=Math.max(...counts);
  return `<div class="poll ${closed?"closed":""}"><div class="poll-q">📊 ${esc(censor(pl.q||""))}</div>
    ${opts.map((o,i)=>{ const pct=total?Math.round(counts[i]/total*100):0;
      return `<button type="button" class="poll-opt ${mine===i?"mine":""} ${closed&&counts[i]===top&&top>0?"win":""}" data-vote="${esc(x.id)}" data-opt="${i}" ${closed||S.readonly?"disabled":""} aria-pressed="${mine===i}"><i style="width:${pct}%"></i><span>${mine===i?"✅ ":""}${esc(censor(o))}</span><b>${pct}%</b></button>`; }).join("")}
    <div class="poll-foot"><span>${total} ${total===1?"vote":"votes"}${closed?" · Poll ended":mine>=0?" · Tap your pick again to undo":""}</span>${canEnd?`<button type="button" class="link-btn" data-endpoll="${esc(x.id)}">End poll</button>`:""}</div></div>`;
}
async function votePoll(id, opt){
  const m=S.msgs.find(x=>x.id===id); if(!m || !m.poll || m.poll.closed) return;
  if(isTimedOut()){ toast("You're timed out and can't vote right now."); return; }
  const cur=(m.votes||{})[S.uid];
  try{ await api.update(key(), id, {votes:{[S.uid]: cur===opt ? -1 : opt}}); }catch(e){ toast("Couldn't save your vote."); }
}

/* ================= threads ================= */
const threadKey = (k,id) => "th~"+k+"~"+id;
function openThread(id){
  const m=S.msgs.find(x=>x.id===id); if(!m) return;
  closeThread(true);
  S.thread={k:key(), id, msg:m}; S.threadMsgs=[]; S.threadLoading=true;
  const tk=threadKey(S.thread.k,id);
  S.threadUnsub=api.watchChannel(tk, list=>{ if(!S.thread||S.thread.id!==id) return; S.threadLoading=false; if(list) S.threadMsgs=list; renderThread(); }, 100);
  $("threadPanel").hidden=false; $("app").classList.add("thread-open");
  renderThread(); setTimeout(()=>$("thInput")&&$("thInput").focus(),50);
}
function closeThread(keepOpen){
  if(S.threadUnsub){ S.threadUnsub(); S.threadUnsub=null; }
  S.thread=null; S.threadMsgs=[];
  if(!keepOpen){ const tp=$("threadPanel"); if(tp){ tp.hidden=true; tp.innerHTML=""; } $("app").classList.remove("thread-open"); }
}
function renderThread(){
  const tp=$("threadPanel"); if(!tp || !S.thread) return;
  const parent=S.msgs.find(x=>x.id===S.thread.id)||S.thread.msg, pp=prof(parent.uid);
  const keep=$("thInput")?$("thInput").value:"", hadFocus=document.activeElement&&document.activeElement.id==="thInput";
  const row=x=>{ const p=prof(x.uid); return `<div class="th-msg"><span class="av sm" data-profile="${esc(x.uid)}">${av(p)}</span><div><div class="who"><b ${nameAttr(x.uid,x.uid===S.uid)} data-profile="${esc(x.uid)}">${esc(p.display||p.name)}</b><time>${fmtTime(x.ts)}</time>${x.uid===S.uid||can("manageMessages")?`<button type="button" class="link-btn th-del" data-thdel="${esc(x.id)}">delete</button>`:""}</div><div class="text">${S.blocks.has(x.uid)?`<span class="blocked-msg">🚫 blocked gorilla</span>`:fmtText(x.text||"")}</div></div></div>`; };
  tp.innerHTML=`<div class="th-head"><b>🧵 Thread</b><button class="icon-btn" id="thClose" aria-label="Close thread">✕</button></div>
    <div class="th-body" id="thBody">
      <div class="th-parent"><span class="av sm">${av(pp)}</span><div><div class="who"><b ${nameAttr(parent.uid,parent.uid===S.uid)}>${esc(pp.display||pp.name)}</b><time>${fmtDay(parent.ts)} ${fmtTime(parent.ts)}</time></div><div class="text">${parent.poll?"📊 "+esc(censor(parent.poll.q)):parent.sticker?"[sticker]":fmtText(parent.text||"[image]")}</div></div></div>
      <div class="th-count">${S.threadLoading?"Loading…":S.threadMsgs.length+" "+(S.threadMsgs.length===1?"reply":"replies")}</div>
      ${S.threadMsgs.map(row).join("")}
    </div>
    ${canPostHere()?`<form id="thForm" class="th-form"><input id="thInput" maxlength="600" autocomplete="off" placeholder="Reply in thread" aria-label="Reply in thread"><button class="send" type="submit">Send</button></form>`:`<div class="readonly" style="margin:10px">${esc(postBlockReason()||"You can't reply here.")}</div>`}`;
  $("thClose").onclick=()=>closeThread();
  const b=$("thBody"); b.scrollTop=b.scrollHeight;
  if($("thInput")){ $("thInput").value=keep; if(hadFocus) $("thInput").focus(); }
  if($("thForm")) $("thForm").onsubmit=async e=>{
    e.preventDefault();
    let t=$("thInput").value.trim(); if(!t || !S.thread) return;
    if(hasBad(t)){ t=censor(t); toast("Watch the language! 🍌"); }
    $("thInput").value="";
    const th=S.thread, ts=Date.now(), before=S.threadMsgs.length;
    try{
      await api.send(threadKey(th.k,th.id), {uid:S.uid, ts, text:t.slice(0,600)});
      await api.update(th.k, th.id, {threadCount:Math.max(before+1, S.threadMsgs.length), threadLast:ts});
      earnBanana();
    }catch(err){ toast("Reply didn't send. Try again."); }
  };
  tp.querySelectorAll("[data-thdel]").forEach(bt=>bt.onclick=async()=>{
    const th=S.thread; if(!th) return;
    const before=S.threadMsgs.length;
    try{ await api.remove(threadKey(th.k,th.id), bt.dataset.thdel); await api.update(th.k, th.id, {threadCount:Math.max(0,Math.min(before-1, S.threadMsgs.length))}); }catch(err){ toast("Couldn't delete."); }
  });
  tp.querySelectorAll("[data-profile]").forEach(el=>el.onclick=()=>openPopout(el.dataset.profile, el));
}

/* ================= daily reward ================= */
const dayStr = (d=new Date()) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function dailyState(){
  const p=myProfile()||{}, dl=p.daily||{}, today=dayStr(), y=new Date(); y.setDate(y.getDate()-1);
  const claimed=dl.day===today, cont=dl.day===dayStr(y);
  const streak = claimed ? (dl.streak||1) : cont ? (dl.streak||0)+1 : 1;
  return {claimed, streak, reward: 5+Math.min(streak-1,5)*2};
}
function openDaily(){
  const st=dailyState();
  openModal(`<div class="card daily" role="dialog" aria-modal="true" aria-labelledby="dlTitle" style="width:min(460px,100%)">
    <div class="row"><h2 id="dlTitle">🎁 Daily bananas</h2><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="streak">${Array.from({length:7},(_,i)=>{ const n=i+1, got=st.claimed?n<=Math.min(st.streak,7):n<Math.min(st.streak,7); return `<div class="sday ${got?"got":""} ${!st.claimed&&n===Math.min(st.streak,7)?"next":""}"><b>Day ${n}</b><span>${5+Math.min(n-1,5)*2}🍌</span></div>`; }).join("")}</div>
    <p class="note" style="margin:0">${st.claimed?`You grabbed today's bananas. Streak: <b>${st.streak} ${st.streak===1?"day":"days"}</b> 🔥 Come back tomorrow!`:`Day ${st.streak} of your streak. Come back every day for bigger rewards, up to 15🍌. Miss a day and the streak starts over.`}</p>
    ${st.claimed?"":`<button class="big-btn" id="claimBtn">Grab ${st.reward} 🍌</button>`}
  </div>`);
  if($("claimBtn")) $("claimBtn").onclick=claimDaily;
}
async function claimDaily(){
  const st=dailyState(); if(st.claimed) return;
  const me=myProfile(), before=levelOf(xpOf(me));
  const upd={daily:{day:dayStr(), streak:st.streak}, bananas:(me.bananas||0)+st.reward, xp:xpOf(me)+st.reward};
  try{ await api.updateProfile(upd); Object.assign(me,upd); }catch(e){ toast("Couldn't grab your bananas. Try again."); return; }
  closeModal(); renderMe(); renderTroop();
  toast(`+${st.reward} 🍌 · ${st.streak}-day streak!`+(levelOf(me.xp)>before?` Level up! You're level ${levelOf(me.xp)}`:""), true);
}

async function decodeFrames(file){
  if((file.type==="image/gif"||file.type==="image/webp") && window.ImageDecoder){
    try{
      const dec=new ImageDecoder({data:await file.arrayBuffer(), type:file.type});
      await dec.tracks.ready;
      const n=(dec.tracks.selectedTrack&&dec.tracks.selectedTrack.frameCount)||1;
      const idx=[...new Set([0,Math.floor(n/3),Math.floor(2*n/3),n-1])].filter(i=>i>=0&&i<n);
      const frames=[];
      for(const i of idx){ const r=await dec.decode({frameIndex:i}); frames.push(await createImageBitmap(r.image)); try{ r.image.close(); }catch(e){} }
      try{ dec.close(); }catch(e){}
      return {frames, animated:n>1, checkedAll:true};
    }catch(e){}
  }
  const bmp=await createImageBitmap(file);
  return {frames:[bmp], animated:false, checkedAll:file.type!=="image/gif"};
}
function cropTo(src, W, H, type, q){
  const sw=src.displayWidth||src.width, sh=src.displayHeight||src.height;

  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const ctx=c.getContext("2d");
  if(type==="image/jpeg"){ ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H); }
  ctx.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("encode")), type, q));
}

    const r=await S.sample.json(prompt,{images, modelTier:"quick"});
    if(r && r.ok===true) return {ok:true};
    return {ok:false, reason:String((r&&r.reason)||"It doesn't follow the picture rules.").slice(0,120)};
  }catch(e){
    const c=e&&e.code;
    if(c==="refused") return {ok:false, reason:"It doesn't follow the picture rules."};
    throw new Error(c==="not_granted"?"The safety checker needs your OK. Allow Claude for this page, then try again."
      : c==="rate_limited"?"Too many checks right now. Try again in a few minutes."
      : c==="image_rejected"?"That picture couldn't be read. Try a different one."
      : c==="images_unavailable"||c==="sampling_disabled"?"The safety checker isn't available here, so pictures can't be uploaded."
      : "Couldn't check your picture. Try again.");
  }
}
const SQUARE_KINDS=["avatar","srvIcon"];
async function handleMedia(file, kind, say, save){
  if(!S.assets || !picCheckerReady()){ say("Pictures can't be uploaded here.","bad"); return; }
  if(!/^image\/(png|jpeg|gif|webp)$/.test(file.type)){ say("Pick a PNG, JPG, GIF or WebP picture.","bad"); return; }
  if(file.size>8*1024*1024){ say("That picture is over 8 MB. Try a smaller one.","bad"); return; }
  if(S.mediaBusy) return; S.mediaBusy=true;
  const frames=[];
  try{
    say("Getting your picture ready…","busy");
    let dec;
    try{ dec=await decodeFrames(file); }catch(e){ say("That picture couldn't be opened. Try another one.","bad"); return; }
    frames.push(...dec.frames);
    const lim=S.sample ? await S.sample.limits().catch(()=>null) : {images:{maxCount:4}};
    if(!lim || !lim.images){ say("The safety checker can't look at pictures here, so uploads are off.","bad"); return; }
    const sq=SQUARE_KINDS.includes(kind), big=sq?[512,512]:[1024,342], small=sq?[256,256]:[960,320];
    const checks=[];
    for(const f of frames.slice(0, Math.max(1,lim.images.maxCount||1))) checks.push(await cropTo(f,big[0],big[1],"image/jpeg",.85));
    const still=await cropTo(frames[0],small[0],small[1],"image/webp",.9);
    say("🛡 Safety check… making sure it's OK for everyone","busy");
    let v;
    try{ v=await checkPicture(checks, kind); }catch(e){ say(e.message,"bad"); return; }
    if(!v.ok){ say("🚫 Not allowed: "+v.reason+" Pick a different picture.","bad"); playSfx("lava", true); return; }
    say("Looks good! Uploading…","busy");
    const upStill=await S.assets.upload(new File([still], kind+".webp", {type:"image/webp"}));
    let main=upStill.id, gif=false, note="";
    if(dec.animated && dec.checkedAll){
      if(file.size<=MAX_GIF()){ const r=await S.assets.upload(file); main=r.id; gif=true; }
      else note=` It's too big to animate (over ${ON_SITE()?"480 KB":"6 MB"}), so it shows as a still picture.`;
    } else if(file.type==="image/gif" && !dec.checkedAll) note=" Animated pictures need Chrome or Edge to check, so it shows as a still picture.";
    const val={id:main, still:upStill.id, gif, anim:gif, ts:Date.now()};
    if(save){ await save(val); say("Saved! 🎉"+note,"good"); return; }
    await api.updateProfile({[kind]:val});
    myProfile()[kind]=val;
    renderAll();
    openUserSettings("profile");
    say((kind==="avatar"?"New profile picture saved! 🎉":"New banner saved! 🎉")+note,"good");
  }catch(e){
    say(e && e.code==="too_large"?"That picture is too big to store.": e && e.code==="not_granted"?"You don't have permission to upload pictures here.":"Upload failed. Try again.","bad");
  }finally{
    frames.forEach(f=>{ try{ f.close(); }catch(e){} });
    S.mediaBusy=false;
  }
}

const EMOJI_MAX=24;
function canManageEmojis(m){ return !!m && !m.home && (S.isOwner || (!m.builtin && m.owner===S.uid)); }
function shrinkEmoji(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const c=document.createElement("canvas"); c.width=c.height=48; const x=c.getContext("2d");
      const s=Math.min(48/img.width,48/img.height), w=img.width*s, h=img.height*s; x.drawImage(img,(48-w)/2,(48-h)/2,w,h);
      URL.revokeObjectURL(url); let d=c.toDataURL("image/webp",.85); if(!d.startsWith("data:image/webp")) d=c.toDataURL("image/png"); res(d); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(); }; img.src=url;
  });
}
function openEmojiManager(m){
  if(!canManageEmojis(m)) return;
  const list=mapEmojis(m.id); let pending=null;
  openModal(`<div class="card" role="dialog" aria-modal="true" aria-labelledby="emTitle" style="width:min(480px,100%)">

    <div class="em-grid">${list.length?list.map(e=>`<div class="em-item"><img class="cemoji big" src="${e.data}" alt=":${esc(e.name)}:"><code>:${esc(e.name)}:</code><button type="button" class="danger-btn" data-emdel="${esc(e.name)}" aria-label="Delete :${esc(e.name)}:">✕</button></div>`).join(""):`<p class="note">No custom emojis yet.</p>`}</div>
    ${list.length<EMOJI_MAX?`<div class="em-add"><label class="btn" for="emFile">📁 Pick a picture</label><input type="file" id="emFile" accept="image/png,image/jpeg,image/gif,image/webp" hidden><span class="em-prev" id="emPrev"></span>
      <input id="emName" maxlength="24" placeholder="name, like banana_dance" aria-label="Emoji name" autocomplete="off"><button type="button" class="btn primary" id="emSave">Add</button></div>`:`<p class="note">You've reached ${EMOJI_MAX} emojis. Delete one to add another.</p>`}
    <div class="err" id="emErr"></div></div>`);
  const save=async next=>{ try{ await store.set("emoji/"+m.id,{list:next}); S.emojis=Object.assign({},S.emojis,{[m.id]:{list:next}}); return true; }catch(e){ $("emErr").textContent="Couldn't save. Try a smaller picture."; return false; } };
  if($("emFile")) $("emFile").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ pending=await shrinkEmoji(f); $("emPrev").innerHTML=`<img class="cemoji big" src="${pending}" alt="">`; if(!$("emName").value) $("emName").value=f.name.replace(/\.[^.]+$/,"").toLowerCase().replace(/[^a-z0-9_]+/g,"_").replace(/^_+|_+$/g,"").slice(0,24); }catch(err){ $("emErr").textContent="That picture didn't work. Try a PNG or JPG."; } };
  if($("emName")) $("emName").oninput=e=>{ e.target.value=e.target.value.toLowerCase().replace(/[^a-z0-9_]/g,""); };
  if($("emSave")) $("emSave").onclick=async()=>{
    const name=$("emName").value.trim();
    if(!pending){ $("emErr").textContent="Pick a picture first."; return; }
    if(!/^[a-z0-9_]{2,24}$/.test(name)){ $("emErr").textContent="Names need 2 to 24 letters, numbers or underscores."; return; }
    if(hasBad(name)){ $("emErr").textContent="That name has a word we don't allow."; return; }
    if(list.some(e=>e.name===name)||EMOJI_NAMES[name]){ $("emErr").textContent="That name is already taken."; return; }
    if(await save(list.concat({name,data:pending,by:S.uid}))){ toast("Added :"+name+":"); openEmojiManager(m); renderFeed(); }
  };
  $("modal").querySelector(".card").addEventListener("click",async e=>{ const d=e.target.closest("[data-emdel]"); if(!d) return; if(await save(list.filter(x=>x.name!==d.dataset.emdel))){ toast("Deleted :"+d.dataset.emdel+":"); openEmojiManager(m); renderFeed(); } });
}

const EMOJI_NAMES={banana:"🍌",fire:"🔥",gorilla:"🦍",monkey:"🐒",joy:"😂",skull:"💀",sob:"😭",rofl:"🤣",cool:"😎",cold:"🥶",mindblown:"🤯",eyes:"👀","100":"💯",heart:"❤️",thumbsup:"👍",thumbsdown:"👎",tada:"🎉",palm:"🌴",tree:"🌳",volcano:"🌋",lava:"🌋",mountain:"🏔️",cloud:"☁️",moon:"🌙",star:"⭐",trophy:"🏆",goat:"🐐",pray:"🙏",angry:"😡",clown:"🤡",cap:"🧢",crown:"👑",tophat:"🎩",headphones:"🎧",salute:"🫡",wave:"👋",smile:"😄",wink:"😉",sus:"🤨",ghost:"👻",rocket:"🚀",sparkles:"✨",party:"🥳",zzz:"💤",muscle:"💪",clap:"👏",ok:"👌",point:"👉"};
function getSuggest(){
  const i=$("msgInput"); if(!i) return null;
  const v=i.value.slice(0, i.selectionStart ?? i.value.length);
  if(v.startsWith("/") && !v.includes(" ")){ const items=CMDS.filter(c=>c[0].startsWith(v.toLowerCase())).map(c=>({k:"cmd",val:c[0],label:c[0],sub:c[1]})); return items.length?{items,from:0,to:v.length}:null; }
  let mm=/(^|\s)@([A-Za-z0-9_]{0,16})$/.exec(v);
  if(mm){
    const q=mm[2].toLowerCase(), from=v.length-mm[2].length-1;
    const ids=S.mapId==="home" ? [S.chan,S.uid].filter(Boolean) : Object.keys(S.profiles);
    const items=ids.filter(u=>!S.blocks.has(u)).map(u=>prof(u)).filter(p=>p.name && (p.name.toLowerCase().startsWith(q)||(p.display||"").toLowerCase().startsWith(q))).slice(0,8)
      .map(p=>({k:"user",val:"@"+p.name+" ",label:p.display||p.name,sub:"@"+p.name,p}));
    return items.length?{items,from,to:v.length}:null;
  }
  mm=/(^|\s):([a-z0-9_]{2,20})$/.exec(v);
  if(mm){
    const q=mm[2], from=v.length-q.length-1;
    const custom=(S.mapId!=="home"?mapEmojis():[]).filter(e=>e.name.startsWith(q)).map(e=>({k:"emoji",val:":"+e.name+": ",label:":"+e.name+":",sub:"server emoji",img:e.data}));
    const items=custom.concat(Object.entries(EMOJI_NAMES).filter(([n])=>n.startsWith(q)).map(([n,e])=>({k:"emoji",val:e+" ",label:e+"  :"+n+":",sub:""}))).slice(0,8);
    return items.length?{items,from,to:v.length}:null;
  }
  return null;
}
function applySuggest(sg, idx){
  const i=$("msgInput"), it=sg.items[idx]; if(!it) return;
  const after=i.value.slice(sg.to);
  i.value=i.value.slice(0,sg.from)+it.val+after;
  const pos=sg.from+it.val.length; i.focus(); i.setSelectionRange(pos,pos);
  S.cmdSel=0; renderCmds();
}

/* ================= petals ================= */
(function petals(){
  const cv=$("petals"), ctx=cv.getContext("2d"); let W=0,H=0,P=[],raf=0;
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  function size(){ W=cv.width=innerWidth*devicePixelRatio; H=cv.height=innerHeight*devicePixelRatio; }
  function seed(){ P=Array.from({length:Math.min(36,Math.round(innerWidth/30))},()=>({x:Math.random()*W,y:Math.random()*H,r:(4+Math.random()*5)*devicePixelRatio,v:(.3+Math.random()*.7)*devicePixelRatio,a:Math.random()*6.28,s:.01+Math.random()*.02})); }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const night=document.documentElement.dataset.sky==="night";
    P.forEach(p=>{
      if(!reduce){ p.y+=p.v; p.x+=Math.sin(p.a)*.6*devicePixelRatio; p.a+=p.s; if(p.y>H+10){ p.y=-10; p.x=Math.random()*W; } }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a);
      if(night){ ctx.fillStyle="rgba(255,226,120,"+(.35+.35*Math.sin(p.a*3))+")"; ctx.beginPath(); ctx.arc(0,0,p.r*.35,0,7); ctx.fill(); }
      else { ctx.fillStyle="rgba(255,143,200,.85)"; ctx.beginPath(); ctx.ellipse(0,0,p.r,p.r*.55,0,0,7); ctx.fill(); ctx.fillStyle="rgba(255,240,247,.7)"; ctx.beginPath(); ctx.ellipse(-p.r*.2,0,p.r*.35,p.r*.18,0,0,7); ctx.fill(); }
      ctx.restore();
    });
    if(!reduce && !$("auth").hidden) raf=requestAnimationFrame(draw);
  }
  size(); seed();
  addEventListener("resize",()=>{ size(); seed(); if(reduce) draw(); });
  window.__petals=()=>{ cancelAnimationFrame(raf); draw(); };
  draw();
})();

const EMAIL_RE=/^[^\s@]{1,64}@[^\s@]{1,190}\.[a-z]{2,24}$/i;
const hexOf = buf => Array.from(new Uint8Array(buf),x=>x.toString(16).padStart(2,"0")).join("");
async function pwHash(pw, saltHex, iter){
  const salt=new Uint8Array(saltHex.match(/../g).map(h=>parseInt(h,16)));
  const key=await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return hexOf(await crypto.subtle.deriveBits({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"}, key, 256));
}
async function makeCred(email, pw){
  const salt=hexOf(crypto.getRandomValues(new Uint8Array(16))), iter=150000;
  return {email:email.trim().toLowerCase(), salt, iter, hash:await pwHash(pw,salt,iter), set:Date.now()};
}
async function saveCred(c){
  S.cred=c;
  if(S.mode==="live") await S.db.doc("data/users/"+S.uid+"/login").set(c);
  else { local.cred=c; saveLocal(); }
}
async function checkCred(email, pw){
  const c=S.cred; if(!c) return false;
  if(email.trim().toLowerCase()!==c.email) { await pwHash(pw,c.salt,c.iter); return false; }
  return (await pwHash(pw,c.salt,c.iter))===c.hash;
}
function pwProblem(pw, confirm){
  if(pw.length<8) return "Passwords need at least 8 characters.";
  if(!/[a-z]/i.test(pw) || !/[0-9]/.test(pw)) return "Use at least one letter and one number.";
  if(/^(password|12345678|qwerty12|gorilla1|banana12)/i.test(pw)) return "That password is too easy to guess.";
  if(confirm!==undefined && pw!==confirm) return "The two passwords don't match.";
  return "";
}
function pwStrength(pw){
  let sc=0; if(pw.length>=8) sc++; if(pw.length>=12) sc++; if(/[a-z]/.test(pw)&&/[A-Z]/.test(pw)) sc++; if(/[0-9]/.test(pw)) sc++; if(/[^a-z0-9]/i.test(pw)) sc++;
  return sc<=2?["Weak","weak"]:sc<=3?["Okay","ok"]:["Strong","strong"];
}
const maskEmail = e => { const [u,d]=String(e||"").split("@"); return d ? u.slice(0,2)+"•••@"+d : ""; };

}

  i.addEventListener("input",()=>{ if(!i.value){ out.textContent=""; out.className="pw-str"; return; } const [t,c]=pwStrength(i.value); out.textContent="Password strength: "+t; out.className="pw-str "+c; });
}

/* ================= two-step login (authenticator app) ================= */
const B32="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
function b32encode(bytes){ let bits=0,val=0,out=""; for(const b of bytes){ val=(val<<8)|b; bits+=8; while(bits>=5){ out+=B32[(val>>>(bits-5))&31]; bits-=5; } } if(bits>0) out+=B32[(val<<(5-bits))&31]; return out; }
function b32decode(str){ const s=str.replace(/=+$/,"").toUpperCase().replace(/[^A-Z2-7]/g,""); let bits=0,val=0; const out=[]; for(const ch of s){ val=(val<<5)|B32.indexOf(ch); bits+=5; if(bits>=8){ out.push((val>>>(bits-8))&255); bits-=8; } } return new Uint8Array(out); }
async function totpAt(secret, counter){
  const key=await crypto.subtle.importKey("raw", b32decode(secret), {name:"HMAC",hash:"SHA-1"}, false, ["sign"]);
  const msg=new ArrayBuffer(8), dv=new DataView(msg); dv.setUint32(0,Math.floor(counter/4294967296)); dv.setUint32(4,counter>>>0);
  const h=new Uint8Array(await crypto.subtle.sign("HMAC", key, msg)), o=h[h.length-1]&15;
  const code=((h[o]&127)<<24|h[o+1]<<16|h[o+2]<<8|h[o+3])%1000000;
  return String(code).padStart(6,"0");
}
async function totpOk(secret, code){
  code=String(code||"").replace(/\D/g,""); if(code.length!==6) return false;
  const c=Math.floor(Date.now()/30000);
  for(const w of [0,-1,1]) if(await totpAt(secret,c+w)===code) return true;
  return false;
}
async function sha256(t){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,"0")).join(""); }
async function saveSec(sec){
  S.sec=sec;
  if(S.mode==="live"){ if(sec) await S.db.doc("data/users/"+S.uid+"/security").set(sec); else await S.db.doc("data/users/"+S.uid+"/security").delete(); }
  else { local.sec=sec; saveLocal(); }
}
const trusted = () => { const t=(local.trust2fa||{})[S.uid]; return t && t>Date.now(); };
function needs2FA(){ if(S.fb) return false; /* the server asks for the code when you log in */ return !!(S.sec && S.sec.on && S.sec.secret) && !trusted(); }
function open2FAPrompt(onPass){
  const m=$("modal");
  m.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-labelledby="tfTitle" style="width:min(420px,100%)">
    <h2 id="tfTitle">🔐 Two-step login</h2>

    <form id="tfForm" style="display:flex;flex-direction:column;gap:12px" novalidate>
      <input id="tfCode" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="11" placeholder="123456" aria-label="Six-digit code or backup code">

      <div class="err" id="tfErr"></div>

    if(S.tfFails>=5 && Date.now()<(S.tfWait||0)){ $("tfErr").textContent="Too many tries. Wait 30 seconds."; return; }
    let ok=await totpOk(S.sec.secret, raw);
    if(!ok && raw.replace(/[^a-z0-9]/gi,"").length===10){
      const h=await sha256(raw.replace(/[^a-z0-9]/gi,"").toLowerCase());
      const list=S.sec.backup||[];
      if(list.includes(h)){ ok=true; await saveSec(Object.assign({},S.sec,{backup:list.filter(x=>x!==h)})).catch(()=>{}); toast("Backup code used. "+(list.length-1)+" left."); }
    }
    if(!ok){ S.tfFails++; if(S.tfFails>=5) S.tfWait=Date.now()+30000; $("tfErr").textContent="That code didn't work. Check the time on your phone and try again."; $("tfCode").select(); return; }
    S.tfFails=0;
    if($("tfTrust").checked){ local.trust2fa=local.trust2fa||{}; local.trust2fa[S.uid]=Date.now()+30*86400000; saveLocal(); }
    closeModal(); onPass();
  };
}

  if(!$("popout").hidden){ $("popout").hidden=true; return; }

  if(!$("modal").hidden){ if(!$("modal").querySelector("[data-lock]")) closeModal(); return; }
  if(S.editing){ S.editing=null; renderFeed(); }
});

/* ================= events ================= */
$("rail").addEventListener("click",e=>{
  if(e.target.closest("#addServer")){ openAddServer(); return; }
  const b=e.target.closest("[data-map]"); if(!b) return;
  if(b.dataset.map==="home"){ S.mapId="home"; S.chan=S.lastDM||""; switchTo(); return; }
  const m=allMaps().find(x=>x.id===b.dataset.map); if(!m) return;
  S.mapId=m.id; S.chan=firstChan(m); switchTo();
});
$("sideHead").addEventListener("click",e=>{ const sm=e.target.closest("#srvMenu"); if(sm){ openServerMenu(sm); return; } if(e.target.closest("#srvSettings")) (curMap().builtin ? openMapSettings() : openServerSettings()); });
$("chans").addEventListener("click",e=>{
  if(e.target.closest("#addChan")){ curMap().builtin ? openMapSettings() : openAddChannel(); return; }
  const lv=e.target.closest("[data-leave]");
  if(lv){ e.stopPropagation(); local.rooms=(local.rooms||[]).filter(c=>c!==lv.dataset.leave); saveLocal(); syncWatchers(); toast("Left room "+lv.dataset.leave);
    if(S.mapId==="room"){ if(local.rooms.length){ S.chan=local.rooms[0]; } else { S.mapId="forest"; S.chan="general"; } switchTo(); } else renderAll(); return; }
  if(e.target.closest("[data-friendshome]")){ S.mapId="home"; S.chan=""; S.friendTab=S.friendTab||"online"; switchTo(); if(innerWidth<=720) $("app").classList.remove("open"); return; }
  const dm=e.target.closest("[data-dm]");
  if(dm){ openDM(dm.dataset.dm); return; }
  const c=e.target.closest("[data-chan]"), v=e.target.closest("[data-vc]");
  if(c){ S.chan=c.dataset.chan; switchTo(); $("app").classList.remove("open"); }
  if(v){ joinVC(v.dataset.vc); $("app").classList.remove("open"); }
});
$("feed").addEventListener("click",e=>{
  const t=e.target;
  const dmb=t.closest("[data-dm]"); if(dmb){ openDM(dmb.dataset.dm); return; }
  if(t.closest("[data-grpset]")){ openGroupSettings(); return; }
  const vb=t.closest("[data-vote]"); if(vb){ votePoll(vb.dataset.vote, +vb.dataset.opt); return; }
  const ep=t.closest("[data-endpoll]"); if(ep){ api.update(key(), ep.dataset.endpoll, {poll:{closed:true}}).then(()=>toast("Poll ended")).catch(()=>toast("Couldn't end the poll.")); return; }
  const th=t.closest("[data-thread]"); if(th){ openThread(th.dataset.thread); return; }
  const sh=t.closest("[data-show]"); if(sh){ S.shown[sh.dataset.show]=1; renderFeed(); return; }
  const ag=t.closest("#agreeNow"); if(ag){ api.updateProfile({rulesOk:RULES_V}).then(()=>{ myProfile().rulesOk=RULES_V; renderFeed(); toast("Thanks for agreeing! 🦍"); }).catch(()=>toast("Couldn't save. Try again.")); return; }
  const r=t.closest("[data-react]"); if(r){ toggleReact(r.dataset.id, r.dataset.react); return; }
  const mo=t.closest("[data-more]"); if(mo){ openEmojiPop(mo.dataset.more, mo); return; }
  const rp=t.closest("[data-reply]"); if(rp){ const m=S.msgs.find(x=>x.id===rp.dataset.reply); if(m){ S.replyTo={id:m.id,uid:m.uid,text:m.text||(m.sticker?"sticker":"image")}; renderComposeBits(); $("msgInput").focus(); } return; }
  const pn=t.closest("[data-pin]"); if(pn){ togglePin(pn.dataset.pin); return; }
  const ed=t.closest("[data-edit]"); if(ed){ const m=S.msgs.find(x=>x.id===ed.dataset.edit); S.editing=m.id; S.editText=m.text; renderFeed(); return; }
  const d=t.closest("[data-del]"); if(d){ if(d.dataset.armed==="1") delMsg(d.dataset.del); else { d.dataset.armed="1"; d.textContent="✔"; d.title="Tap again to delete"; setTimeout(()=>{ if(d.isConnected){ d.dataset.armed=""; d.textContent="🗑"; } },2500); } return; }
  const j=t.closest("[data-jump]"); if(j){ jumpTo(j.dataset.jump); return; }
  const p=t.closest("[data-profile]"); if(p){ openPopout(p.dataset.profile, p); return; }
});
$("feed").addEventListener("input",e=>{ if(e.target.id==="editInput") S.editText=e.target.value; });
$("feed").addEventListener("submit",e=>{ if(e.target.matches("[data-editform]")){ e.preventDefault(); saveEdit(); } });
$("stage").addEventListener("click",e=>{ const p=e.target.closest(".tile[data-profile]"); if(p && !e.target.closest("button,input")) openPopout(p.dataset.profile, p); });
$("troop").addEventListener("click",e=>{ const p=e.target.closest("[data-profile]"); if(p) openPopout(p.dataset.profile, p); });
$("meAv").onclick=()=>{ const m=$("statusMenu"); if(m.hidden) openStatusMenu(); else m.hidden=true; };
function toggleSky(){ local.sky = local.sky==="night"?"day":"night"; saveLocal(); applySky(); window.__petals&&window.__petals(); }
$("skyBtn").onclick=toggleSky; $("authSky").onclick=toggleSky;
$("settingsBtn").onclick=()=>openUserSettings("account");
$("soundBtn").onclick=()=>{ local.mute=!local.mute; saveLocal(); renderMe(); if(!local.mute){ ook(); } toast(local.mute?"Mention sounds off":"Mention sounds on"); };
$("pinsBtn").onclick=openPins;
$("slowBtn").onclick=e=>openSlowMenu(e.currentTarget);
$("reportsBtn").onclick=openReports;
$("grpBtn").onclick=openGroupSettings;
$("newGrpBtn").onclick=openNewGroup;
$("muteBtn").onclick=()=>{ local.muted=local.muted||{}; const k=key(); if(local.muted[k]) delete local.muted[k]; else local.muted[k]=1; saveLocal(); syncWatchers(); renderAll(); toast(local.muted[k]?"Muted #"+S.chan+". No unread dots or pings.":"Unmuted #"+S.chan); };
$("qsBtn").onclick=openSwitcher;
document.addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k" && S.loggedIn){ e.preventDefault(); openSwitcher(); } });
function openSwitcher(){
  const items=[];
  allMaps().forEach(m=>m.chans.forEach(c=>items.push({k:"c",label:"# "+c.id,sub:m.name,map:m.id,chan:c.id,icon:m.short})));
  Object.keys(S.profiles).filter(u=>u!==S.uid && !S.blocks.has(u)).forEach(u=>items.push({k:"d",label:"@ "+prof(u).name,sub:"Direct message",uid:u}));
  let sel=0, list=items;
  openModal(`<div class="card switcher" role="dialog" aria-modal="true" aria-label="Quick switcher">
    <input id="qsInput" placeholder="Where do you want to go?" autocomplete="off" aria-label="Search channels and gorillas">
    <div id="qsList" class="qs-list" role="listbox"></div>
    <small class="note" style="text-align:left">↑ ↓ to pick · Enter to go · Esc to close</small></div>`);
  const draw=()=>{ $("qsList").innerHTML=list.slice(0,40).map((it,i)=>`<button type="button" role="option" aria-selected="${i===sel}" data-i="${i}"><span>${it.k==="c"?esc(it.icon):"💬"}</span><b>${esc(it.label)}</b><small>${esc(it.sub)}</small></button>`).join("")||`<p class="note">Nothing found.</p>`; };
  const go=it=>{ if(!it) return; closeModal(); if(it.k==="d") openDM(it.uid); else { S.mapId=it.map; S.chan=it.chan; switchTo(); } };
  $("qsInput").oninput=e=>{ const q=e.target.value.toLowerCase().trim(); list=q?items.filter(it=>(it.label+" "+it.sub).toLowerCase().includes(q)):items; sel=0; draw(); };
  $("qsInput").onkeydown=e=>{ if(e.key==="ArrowDown"){ e.preventDefault(); sel=Math.min(sel+1,Math.min(list.length,40)-1); draw(); } if(e.key==="ArrowUp"){ e.preventDefault(); sel=Math.max(sel-1,0); draw(); } if(e.key==="Enter"){ e.preventDefault(); go(list[sel]); } };
  $("qsList").onclick=e=>{ const b=e.target.closest("[data-i]"); if(b) go(list[+b.dataset.i]); };
  draw(); $("qsInput").focus();
}
document.addEventListener("click",e=>{
  const d=e.target.closest && e.target.closest("[data-doc]"); if(d && !d.closest("#signupForm") && !d.closest(".card[aria-labelledby=gateTitle]")){ openDoc(d.dataset.doc); return; }
  const g=e.target.closest && e.target.closest("[data-go]"); if(g){ S.chan=g.dataset.go; switchTo(); return; }
  const ub=e.target.closest && e.target.closest("#compose [data-unblock]"); if(ub){ toggleBlock(ub.dataset.unblock); }
});
$("inboxBtn").onclick=openInbox; $("savedBtn").onclick=openSaved;
setInterval(()=>{ if(S.loggedIn && store){ watchInbox(); watchSaved(); watchEvents(); watchSounds(); } }, 1500);
$("searchBtn").onclick=()=>{ const bar=$("searchbar"); bar.hidden=!bar.hidden; $("searchBtn").setAttribute("aria-pressed",!bar.hidden); if(!bar.hidden) $("searchInput").focus(); else { S.search=""; $("searchInput").value=""; renderFeed(); } };
$("searchClose").onclick=()=>$("searchBtn").click();
$("searchInput").oninput=e=>{ S.search=e.target.value; if(S.searchScope && S.searchScope!=="chan") queueGlobalSearch(); else renderFeed(); };
$("searchbar").addEventListener("click",e=>{ const b=e.target.closest("[data-sscope]"); if(!b) return; S.searchScope=b.dataset.sscope;
  $("searchbar").querySelectorAll("[data-sscope]").forEach(x=>x.setAttribute("aria-pressed",x===b));
  $("searchInput").placeholder=S.searchScope==="server"?"Search all of "+(curMap().home?"your DMs":curMap().name):S.searchScope==="dms"?"Search all your DMs":"Search this channel";
  S.gs=null; if(S.searchScope==="chan") renderFeed(); else queueGlobalSearch(); $("searchInput").focus(); });
document.addEventListener("click",e=>{ const sp=e.target.closest && e.target.closest(".spoiler:not(.shown)"); if(sp){ e.preventDefault(); e.stopPropagation(); sp.classList.add("shown"); } }, true);
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.classList && e.target.classList.contains("spoiler")) e.target.classList.add("shown"); });
/* drag a picture onto the chat to send it */
(()=>{ const chat=document.querySelector(".chat"); if(!chat) return; let depth=0;
  const hasFile=e=>e.dataTransfer && [...(e.dataTransfer.types||[])].includes("Files");
  chat.addEventListener("dragenter",e=>{ if(!hasFile(e)||!S.assets||!$("msgInput")) return; depth++; chat.classList.add("drop-on"); });
  chat.addEventListener("dragleave",()=>{ depth=Math.max(0,depth-1); if(!depth) chat.classList.remove("drop-on"); });
  chat.addEventListener("dragover",e=>{ if(hasFile(e)&&S.assets) e.preventDefault(); });
  chat.addEventListener("drop",e=>{ depth=0; chat.classList.remove("drop-on"); if(!hasFile(e)) return; e.preventDefault(); const f=[...e.dataTransfer.files].find(x=>/^image\//.test(x.type)); if(f && S.assets && $("msgInput")) uploadImage(f); else if(f) toast("Pictures can't be sent here."); });
})();
$("feed").addEventListener("scroll",()=>{ const f=$("feed"); if(f.scrollTop<150 && !S.search) loadOlder(); },{passive:true});
$("fileInput").onchange=e=>{ const f=e.target.files[0]; e.target.value=""; if(f) uploadImage(f); };
$("menu").onclick=()=>$("app").classList.add("open");
$("troopBtn").onclick=()=>$("app").classList.add("troop-open");
$("scrim").onclick=()=>$("app").classList.remove("open","troop-open");
document.addEventListener("paste",e=>{
  if(!S.loggedIn || !S.assets || S.readonly) return;
  const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith("image/"));
  if(f){ e.preventDefault(); uploadImage(f); }
});
$("feed").addEventListener("error",e=>{
  if(e.target.matches && e.target.matches("img.shot")) e.target.replaceWith(Object.assign(document.createElement("div"),{className:"empty-feed",textContent:"Image unavailable"}));
}, true);

function bootFailed(e){
  console.error(e);
  $("authBody").innerHTML=`<p class="note">Something went wrong while loading. Reload the page to try again.</p><button class="big-btn" id="reloadBtn">Reload</button>`;
  $("reloadBtn").onclick=()=>location.reload();
}
window.addEventListener("pagehide",()=>{ try{ stopVoice(); }catch(e){} });
boot().catch(bootFailed);
setTimeout(()=>{ if(!S.loggedIn && !S.profilesReady && !(S.fb && !S.authed)) bootFailed(new Error("Timed out waiting for profiles")); }, 25000);
})();
</script>
